<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Cybertruck — top-down cutaway / interior layout.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: bird's-eye view with the roof and tonneau opened up to show
  cabin seating, drive units, ~123 kWh 4680 structural pack, steer-by-wire
  actuators, rear-axle steering motor, and the bed (vault). Front of truck
  at LEFT, rear at RIGHT.

  Exoskeleton panel seams visible — Cybertruck's stainless body is drawn
  in long straight creases because cold-rolled stainless can't form
  compound curves.

  viewBox 800x400 holds the 5683mm L x 2200mm W truck plan.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ctbody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfd3d8" />
      <stop offset="100%" stop-color="#9ea4ab" />
    </linearGradient>
    <linearGradient id="ctglass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a7c4e0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6d8aa8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="ctpack" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3a5e80" />
      <stop offset="50%" stop-color="#4a90c2" />
      <stop offset="100%" stop-color="#3a5e80" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- EXOSKELETON OUTLINE — straight panel creases, no compound      -->
  <!-- curves possible at 30X stainless hardness                      -->
  <!-- ============================================================ -->
  <path d="M 60 200
           L 95 130
           L 175 110
           L 705 110
           L 740 145
           L 740 255
           L 705 290
           L 175 290
           L 95 270
           Z"
        fill="url(#ctbody)" stroke="#444" stroke-width="1.6" />

  <!-- Panel seam lines (straight, never curved — 30X cold-roll constraint) -->
  <g stroke="#666" stroke-width="0.6" stroke-dasharray="4 3">
    <line x1="175" y1="110" x2="175" y2="290" /> <!-- front A-pillar seam -->
    <line x1="290" y1="110" x2="290" y2="290" /> <!-- A-pillar / windshield base -->
    <line x1="440" y1="110" x2="440" y2="290" /> <!-- B-pillar / cab-to-bed seam -->
    <line x1="705" y1="110" x2="705" y2="290" /> <!-- tailgate seam -->
  </g>

  <!-- Front wedge / hood label area -->
  <text x="135" y="200" font-family="ui-sans-serif, system-ui" font-size="9" fill="#444" text-anchor="middle">FRUNK</text>
  <text x="135" y="212" font-family="ui-sans-serif, system-ui" font-size="6" fill="#666" text-anchor="middle">(wedge)</text>

  <!-- Windshield arc (large, single piece, ~1.3m wiper blade) -->
  <path d="M 195 130 Q 245 200 195 270" stroke="url(#ctglass)" stroke-width="16" fill="none" opacity="0.75" />
  <text x="260" y="145" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle" font-style="italic">~1.3m windshield</text>

  <!-- Cabin glass (overhead — no panoramic, just a glass back) -->
  <rect x="295" y="125" width="140" height="150" fill="url(#ctglass)" opacity="0.35" stroke="#7a98b8" stroke-width="0.6" stroke-dasharray="2 2" />

  <!-- ============================================================ -->
  <!-- BED / VAULT (rear) — composite floor over stainless tub        -->
  <!-- ============================================================ -->
  <rect x="445" y="125" width="255" height="150" fill="#9ea4ab" stroke="#555" stroke-width="0.6" opacity="0.6" />
  <text x="572" y="158" font-family="ui-sans-serif, system-ui" font-size="9" fill="#222" text-anchor="middle" font-weight="600">BED (VAULT)</text>
  <text x="572" y="170" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle">1.83m × 1.55m</text>

  <!-- Tonneau cover (three-segment, drawn as segmented overlay on bed) -->
  <g opacity="0.55" stroke="#222" stroke-width="0.6">
    <rect x="445" y="178" width="85" height="46" fill="#2a2d33" />
    <rect x="530" y="178" width="85" height="46" fill="#2a2d33" />
    <rect x="615" y="178" width="85" height="46" fill="#2a2d33" />
  </g>
  <text x="572" y="205" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle" font-style="italic">tonneau (3 segments)</text>

  <!-- Powershare outlets (120V / 240V) markers on bed wall -->
  <circle cx="475" cy="245" r="3" fill="#d4a017" stroke="#666" stroke-width="0.4" />
  <circle cx="490" cy="245" r="3" fill="#d4a017" stroke="#666" stroke-width="0.4" />
  <text x="485" y="265" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">9.6 kW outlets</text>

  <!-- ============================================================ -->
  <!-- WHEELS (4) — large 35" all-terrain tires                       -->
  <!-- ============================================================ -->
  <ellipse cx="225" cy="110" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="225" cy="290" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="645" cy="110" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="645" cy="290" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="225" cy="110" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="225" cy="290" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="645" cy="110" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="645" cy="290" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- DRIVE UNITS — Cyberbeast tri-motor: 1 front + 2 rear           -->
  <!-- ============================================================ -->
  <rect x="195" y="170" width="60" height="60" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="225" y="200" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">FRONT DU</text>
  <text x="225" y="210" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">262 hp</text>

  <!-- Dual rear drive units (Cyberbeast) -->
  <rect x="615" y="148" width="60" height="48" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="645" y="170" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">REAR R</text>
  <text x="645" y="180" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">286 hp</text>

  <rect x="615" y="204" width="60" height="48" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="645" y="225" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">REAR L</text>
  <text x="645" y="236" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">286 hp</text>

  <!-- ============================================================ -->
  <!-- STEER-BY-WIRE ACTUATORS (front L + R)                          -->
  <!-- ============================================================ -->
  <rect x="208" y="138" width="18" height="14" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="216" y="132" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">SbW R</text>
  <rect x="208" y="248" width="18" height="14" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="216" y="273" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">SbW L</text>

  <!-- Rear-axle steering motor (centered between rear wheels) -->
  <rect x="690" y="190" width="14" height="20" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="697" y="220" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">REAR-STEER</text>

  <!-- ============================================================ -->
  <!-- 4680 STRUCTURAL HV PACK (under floor, spans wheelbase)         -->
  <!-- ============================================================ -->
  <rect x="260" y="135" width="350" height="130" fill="url(#ctpack)" stroke="#1a3050" stroke-width="1" opacity="0.55" rx="4" />
  <g stroke="#1a3050" stroke-width="0.4" opacity="0.4">
    <line x1="260" y1="165" x2="610" y2="165" />
    <line x1="260" y1="195" x2="610" y2="195" />
    <line x1="260" y1="225" x2="610" y2="225" />
    <line x1="300" y1="135" x2="300" y2="265" />
    <line x1="340" y1="135" x2="340" y2="265" />
    <line x1="380" y1="135" x2="380" y2="265" />
    <line x1="420" y1="135" x2="420" y2="265" />
    <line x1="460" y1="135" x2="460" y2="265" />
    <line x1="500" y1="135" x2="500" y2="265" />
    <line x1="540" y1="135" x2="540" y2="265" />
    <line x1="580" y1="135" x2="580" y2="265" />
  </g>
  <text x="435" y="252" font-family="ui-sans-serif, system-ui" font-size="9" fill="#0a2240" text-anchor="middle" font-weight="600">4680 STRUCTURAL · ~123 kWh · 400/800V multiplex</text>

  <!-- ============================================================ -->
  <!-- CABIN: front + rear bench (5 seats)                            -->
  <!-- ============================================================ -->
  <!-- Front-row seats -->
  <rect x="305" y="135" width="42" height="55" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="305" y="210" width="42" height="55" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="326" y="167" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">PASS</text>
  <text x="326" y="242" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">DRIVER</text>

  <!-- Yoke / no-column (steer-by-wire) -->
  <rect x="335" y="180" width="18" height="12" fill="#0a0a10" stroke="#444" stroke-width="0.5" rx="1" />
  <text x="344" y="178" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">yoke</text>

  <!-- Center 18.5" touchscreen -->
  <rect x="358" y="188" width="35" height="24" fill="#0a0a12" stroke="#444" stroke-width="0.5" rx="2" />
  <rect x="361" y="191" width="29" height="18" fill="#2a3a5a" opacity="0.7" />
  <text x="375" y="222" font-family="ui-sans-serif, system-ui" font-size="6" fill="#666" text-anchor="middle">18.5"</text>

  <!-- Rear bench -->
  <rect x="395" y="135" width="40" height="62" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="395" y="203" width="40" height="62" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="415" y="170" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">REAR</text>

  <!-- ============================================================ -->
  <!-- 48V LV BUS — yellow ribbon along chassis spine                 -->
  <!-- ============================================================ -->
  <rect x="180" y="100" width="525" height="4" fill="#d4a017" stroke="#7a5a08" stroke-width="0.4" opacity="0.85" />
  <text x="440" y="98" font-family="ui-sans-serif, system-ui" font-size="6" fill="#7a5a08" text-anchor="middle" font-style="italic">48V CAN-FD backbone</text>

  <!-- ============================================================ -->
  <!-- CAMERAS / SENSORS                                              -->
  <!-- ============================================================ -->
  <!-- Front trifocal -->
  <circle cx="248" cy="190" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="248" cy="200" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="248" cy="210" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="262" y="203" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">trifocal</text>

  <!-- Side cameras (B-pillar) -->
  <circle cx="440" cy="118" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="440" cy="282" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="455" y="115" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">side R</text>
  <text x="455" y="291" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">side L</text>

  <!-- Rear camera (tailgate) -->
  <circle cx="700" cy="200" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="725" y="203" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">rear cam</text>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                    -->
  <!-- ============================================================ -->
  <text x="120" y="70" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444">FRONT</text>
  <text x="680" y="70" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444">REAR</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui" font-size="10" font-style="italic" fill="#444" text-anchor="middle">TOP-DOWN · CYBERBEAST TRI-MOTOR</text>

  <path d="M 60 70 L 90 70 L 85 65 M 90 70 L 85 75" stroke="#444" stroke-width="0.8" fill="none" />

  <line x1="60" y1="380" x2="160" y2="380" stroke="#555" stroke-width="1" />
  <text x="110" y="392" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~1 m (to scale)</text>

  <text x="740" y="392" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">5683 mm L × 2200 mm W</text>
</svg>
