name: Post thread to X (manual)

# Posts an owner-approved thread from marketing/posts/<name>/post.json.
# Manual only. `confirm` must be checked or it's a dry run; post-thread.mjs
# writes posted.json and refuses to post the same folder twice.
on:
  workflow_dispatch:
    inputs:
      post_dir:
        description: "Folder under marketing/posts/ (e.g. 2026-09-27-terafab-clearing)"
        required: true
      confirm:
        description: "Actually post (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Post
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_DIR: marketing/posts/${{ inputs.post_dir }}
          CONFIRM_POST: ${{ inputs.confirm && '1' || '0' }}
        run: node scripts/marketing/post-thread.mjs
      - name: Record posted ids
        if: inputs.confirm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/posts/
          git diff --cached --quiet || (git commit -m "marketing: posted ${{ inputs.post_dir }}" && git push)
