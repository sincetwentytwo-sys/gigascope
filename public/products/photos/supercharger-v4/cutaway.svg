<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Supercharger V4 pillar — schematic cutaway / side cross-section.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: left half shows the intact white-on-black pillar with
  HMI screen, NFC pad, retractable cable, NACS connector and holster;
  right half shows the column cut open to expose the comms board,
  contactor relay, internal cable routing, mounting flange, and a
  cross-section of the liquid-cooled cable (with its high-current
  conductor bundle + coolant supply + return tubes). Hotspots in
  supercharger-v4.ts target this image via cutawayHotspot {x,y} in 0..1
  normalized coords.

  viewBox 350x700 (aspect ~ 0.50) chosen to match a slim 2.3 m pillar
  with 350 wide leaving room for the cable + holster on the right side.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="700" viewBox="0 0 350 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="pillarWhite" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dde0e3" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c8ccd1" />
    </linearGradient>
    <linearGradient id="pillarBlack" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#2a2a2f" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e2a3a" />
      <stop offset="100%" stop-color="#1a3f5a" />
    </linearGradient>
    <linearGradient id="cableJacket" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1a1a1f" />
      <stop offset="50%" stop-color="#3a3a3f" />
      <stop offset="100%" stop-color="#1a1a1f" />
    </linearGradient>
    <radialGradient id="conductorBundle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8a560" />
      <stop offset="100%" stop-color="#9c5a20" />
    </radialGradient>
    <linearGradient id="concrete" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#9a9a98" />
      <stop offset="100%" stop-color="#6a6a68" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="700" fill="#f5f5f7" />

  <!-- Concrete pad at bottom -->
  <rect x="0" y="650" width="350" height="50" fill="url(#concrete)" />
  <line x1="0" y1="650" x2="350" y2="650" stroke="#3a3a3f" stroke-width="0.6" />
  <!-- Subtle pad texture -->
  <line x1="40" y1="660" x2="80" y2="660" stroke="#555" stroke-width="0.3" opacity="0.5" />
  <line x1="120" y1="670" x2="170" y2="670" stroke="#555" stroke-width="0.3" opacity="0.5" />
  <line x1="220" y1="680" x2="280" y2="680" stroke="#555" stroke-width="0.3" opacity="0.5" />

  <!-- ============================================================ -->
  <!-- LEFT HALF — INTACT EXTERIOR PILLAR                             -->
  <!-- ============================================================ -->

  <!-- Top status indicator bar (RGB) -->
  <rect x="40" y="62" width="80" height="4" fill="#3a9ad9" stroke="#1a4a6a" stroke-width="0.4" />
  <line x1="42" y1="64" x2="118" y2="64" stroke="#aaddff" stroke-width="0.6" opacity="0.8" />

  <!-- Pillar face (rounded top, slim profile) -->
  <path d="M 40 66 Q 40 60 50 60 L 110 60 Q 120 60 120 66 L 120 600 L 40 600 Z"
        fill="url(#pillarWhite)" stroke="#888" stroke-width="0.8" />

  <!-- Tesla T plate (brushed aluminum) -->
  <rect x="72" y="120" width="16" height="16" fill="#d8d8dc" stroke="#888" stroke-width="0.4" />
  <text x="80" y="132" font-family="ui-sans-serif, system-ui" font-size="9" font-weight="bold" fill="#1a1a1f" text-anchor="middle">T</text>

  <!-- Driver display (LCD) -->
  <rect x="60" y="180" width="40" height="30" fill="url(#screenGlow)" stroke="#0a0a0f" stroke-width="0.6" rx="1" />
  <text x="80" y="194" font-family="ui-monospace, monospace" font-size="6" fill="#7af7c4" text-anchor="middle">125 kW</text>
  <text x="80" y="204" font-family="ui-monospace, monospace" font-size="5" fill="#dde0e3" text-anchor="middle">22 kWh · 68%</text>

  <!-- NFC tap zone -->
  <rect x="68" y="225" width="24" height="18" fill="#1a1a1f" stroke="#3a3a3f" stroke-width="0.4" rx="1" />
  <text x="80" y="237" font-family="ui-sans-serif, system-ui" font-size="5" fill="#7a7a80" text-anchor="middle">NFC</text>

  <!-- 4D badge (lower center) -->
  <circle cx="80" cy="540" r="10" fill="none" stroke="#1a1a1f" stroke-width="0.6" />
  <text x="80" y="544" font-family="ui-sans-serif, system-ui" font-size="7" fill="#1a1a1f" text-anchor="middle">4D</text>

  <!-- Black mounting frame / base wrap on left/bottom -->
  <path d="M 32 80 Q 32 66 46 66 L 40 66 L 40 600 L 32 600 Z" fill="url(#pillarBlack)" stroke="#000" stroke-width="0.4" />
  <rect x="32" y="600" width="92" height="50" fill="url(#pillarBlack)" stroke="#000" stroke-width="0.4" />

  <!-- Holster (magnetic cradle on right side of intact pillar) -->
  <path d="M 124 290 Q 138 290 138 305 L 138 340 Q 138 358 124 358" fill="none" stroke="#3a3a3f" stroke-width="2.4" />
  <ellipse cx="131" cy="322" rx="4" ry="6" fill="#1a1a1f" />

  <!-- NACS connector head plugged into holster -->
  <rect x="124" y="306" width="14" height="34" fill="#2a2a2f" stroke="#000" stroke-width="0.5" rx="2" />
  <!-- 5-pin pattern on connector face -->
  <circle cx="131" cy="316" r="1.4" fill="#888" />
  <circle cx="128" cy="322" r="1.4" fill="#888" />
  <circle cx="134" cy="322" r="1.4" fill="#888" />
  <circle cx="128" cy="330" r="1.4" fill="#888" />
  <circle cx="134" cy="330" r="1.4" fill="#888" />
  <!-- LED ring on connector body -->
  <circle cx="131" cy="346" r="3" fill="none" stroke="#3a9ad9" stroke-width="1" />

  <!-- Cable from top of pillar arcing down to holster -->
  <path d="M 80 60 Q 130 80 145 160 Q 158 240 138 295"
        fill="none" stroke="url(#cableJacket)" stroke-width="6" stroke-linecap="round" />
  <!-- Cable highlight -->
  <path d="M 80 60 Q 130 80 145 160 Q 158 240 138 295"
        fill="none" stroke="#888" stroke-width="1" stroke-linecap="round" opacity="0.4" />

  <!-- Scalp suture line above (none — drop) -->

  <!-- ============================================================ -->
  <!-- JAGGED CUT EDGE — vertical down the middle of the pillar       -->
  <!-- ============================================================ -->

  <path d="M 165 70 L 170 90 L 165 110 L 170 130 L 165 150 L 170 170 L 165 190 L 170 210 L 165 230 L 170 250 L 165 270 L 170 290 L 165 310 L 170 330 L 165 350 L 170 370 L 165 390 L 170 410 L 165 430 L 170 450 L 165 470 L 170 490 L 165 510 L 170 530 L 165 550 L 170 570 L 165 590 L 170 610 L 165 630 L 170 650"
        fill="#555" stroke="#333" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- RIGHT HALF — CUTAWAY (column interior visible)                 -->
  <!-- ============================================================ -->

  <!-- Pillar shell (right edge, thin aluminum wall) -->
  <path d="M 170 60 L 295 60 Q 305 60 305 70 L 305 600 L 170 600 Z"
        fill="#e8e8ee" stroke="#888" stroke-width="0.6" />
  <!-- Outer face thin coat -->
  <rect x="170" y="60" width="135" height="3" fill="#c8ccd1" />
  <!-- Inner wall hatching to show shell thickness on far right -->
  <line x1="300" y1="60" x2="300" y2="600" stroke="#888" stroke-width="0.4" />
  <rect x="300" y="60" width="5" height="540" fill="#9aa0a6" />

  <!-- ── COMPONENT STACK INSIDE PILLAR (top → bottom) ── -->

  <!-- Top: cable entry + retraction mechanism -->
  <rect x="175" y="68" width="120" height="22" fill="#2a2a2f" stroke="#000" stroke-width="0.5" rx="1" />
  <circle cx="210" cy="79" r="6" fill="#3a3a3f" stroke="#000" stroke-width="0.4" />
  <circle cx="210" cy="79" r="2" fill="#888" />
  <text x="260" y="83" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">retraction spool</text>

  <!-- HMI driver board (behind LCD) -->
  <rect x="175" y="170" width="120" height="50" fill="#1a5a3a" stroke="#0e3a24" stroke-width="0.5" />
  <!-- LCD glass on inner side (matches exterior screen position) -->
  <rect x="172" y="180" width="6" height="30" fill="#0e2a3a" stroke="#000" stroke-width="0.3" />
  <!-- Tiny SMT components on the HMI board -->
  <rect x="185" y="178" width="6" height="3" fill="#1a1a1f" />
  <rect x="195" y="178" width="8" height="3" fill="#1a1a1f" />
  <rect x="210" y="178" width="6" height="3" fill="#1a1a1f" />
  <rect x="225" y="178" width="10" height="3" fill="#1a1a1f" />
  <rect x="240" y="178" width="6" height="3" fill="#1a1a1f" />
  <rect x="255" y="178" width="14" height="6" fill="#1a1a1f" />
  <rect x="185" y="200" width="20" height="8" fill="#1a1a1f" />
  <rect x="215" y="200" width="14" height="6" fill="#1a1a1f" />
  <rect x="240" y="200" width="20" height="8" fill="#1a1a1f" />
  <!-- NFC antenna coil (printed on HMI board) -->
  <rect x="185" y="225" width="36" height="22" fill="none" stroke="#d4af37" stroke-width="0.6" />
  <rect x="187" y="227" width="32" height="18" fill="none" stroke="#d4af37" stroke-width="0.4" />
  <rect x="189" y="229" width="28" height="14" fill="none" stroke="#d4af37" stroke-width="0.4" />
  <text x="265" y="237" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">NFC coil</text>
  <text x="265" y="213" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">HMI MCU</text>

  <!-- Comms board (PLC + Ethernet to cabinet) -->
  <rect x="175" y="265" width="120" height="40" fill="#1a5a3a" stroke="#0e3a24" stroke-width="0.5" />
  <rect x="185" y="272" width="20" height="10" fill="#1a1a1f" />
  <rect x="215" y="272" width="16" height="10" fill="#1a1a1f" />
  <rect x="240" y="272" width="40" height="14" fill="#1a1a1f" />
  <!-- RJ45 connector (Ethernet to cabinet) -->
  <rect x="195" y="290" width="22" height="12" fill="#dde0e3" stroke="#888" stroke-width="0.4" />
  <text x="206" y="299" font-family="ui-sans-serif, system-ui" font-size="5" fill="#1a1a1f" text-anchor="middle">RJ45</text>
  <text x="265" y="299" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">comms / PLC</text>

  <!-- Contactor relay (heavy DC switch) -->
  <rect x="180" y="320" width="115" height="65" fill="#3a3a3f" stroke="#000" stroke-width="0.6" rx="1" />
  <!-- Contactor coil housing -->
  <rect x="195" y="335" width="40" height="35" fill="#1a1a1f" stroke="#000" stroke-width="0.5" />
  <text x="215" y="357" font-family="ui-sans-serif, system-ui" font-size="6" font-weight="bold" fill="#dde0e3" text-anchor="middle">COIL</text>
  <!-- Bus bar contacts -->
  <rect x="250" y="335" width="8" height="14" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />
  <rect x="265" y="335" width="8" height="14" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />
  <rect x="250" y="358" width="8" height="14" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />
  <rect x="265" y="358" width="8" height="14" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="254" y1="349" x2="254" y2="358" stroke="#c97f3a" stroke-width="3" />
  <line x1="269" y1="349" x2="269" y2="358" stroke="#c97f3a" stroke-width="3" />
  <text x="280" y="357" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">DC</text>
  <text x="280" y="370" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">1000 V</text>
  <text x="237" y="395" font-family="ui-sans-serif, system-ui" font-size="6" font-style="italic" fill="#444" text-anchor="middle">contactor relay</text>

  <!-- Internal DC bus going down to base/cable -->
  <rect x="200" y="405" width="6" height="120" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.3" />
  <rect x="215" y="405" width="6" height="120" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.3" />
  <text x="240" y="445" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">DC+ / DC−</text>
  <text x="240" y="455" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">to cabinet</text>

  <!-- Coolant supply + return tubes (parallel to bus) -->
  <rect x="235" y="405" width="5" height="120" fill="#4a90c2" stroke="#2a5e88" stroke-width="0.3" />
  <rect x="248" y="405" width="5" height="120" fill="#4a90c2" stroke="#2a5e88" stroke-width="0.3" />
  <text x="295" y="445" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="end">coolant</text>
  <text x="295" y="455" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="end">supply/return</text>

  <!-- Sense + CAN harness -->
  <line x1="275" y1="405" x2="275" y2="525" stroke="#d4d4d8" stroke-width="0.8" />
  <line x1="282" y1="405" x2="282" y2="525" stroke="#d4d4d8" stroke-width="0.8" />
  <line x1="289" y1="405" x2="289" y2="525" stroke="#d4d4d8" stroke-width="0.8" />

  <!-- ── CABLE CROSS-SECTION inset (top right callout) ── -->
  <g transform="translate(228, 100)">
    <!-- Cable jacket outer ring -->
    <circle cx="0" cy="0" r="40" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
    <circle cx="0" cy="0" r="38" fill="#2a2a2f" />
    <!-- High-current conductor bundle (center, gold/copper) -->
    <circle cx="0" cy="0" r="14" fill="url(#conductorBundle)" stroke="#7a4a20" stroke-width="0.5" />
    <!-- Individual wire strands inside bundle -->
    <circle cx="-6" cy="-4" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="6" cy="-4" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="0" cy="-8" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="-6" cy="4" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="6" cy="4" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="0" cy="8" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <circle cx="0" cy="0" r="2.2" fill="#e8a560" stroke="#7a4a20" stroke-width="0.2" />
    <!-- Coolant supply tube (blue, upper left) -->
    <circle cx="-22" cy="-15" r="8" fill="#4a90c2" stroke="#2a5e88" stroke-width="0.5" />
    <text x="-22" y="-13" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">in</text>
    <!-- Coolant return tube (lighter, upper right) -->
    <circle cx="22" cy="-15" r="8" fill="#7ab0d6" stroke="#2a5e88" stroke-width="0.5" />
    <text x="22" y="-13" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">out</text>
    <!-- Sense + CCS/NACS signal wires (bottom) -->
    <circle cx="-18" cy="20" r="2.5" fill="#d4d4d8" />
    <circle cx="-10" cy="24" r="2.5" fill="#d4d4d8" />
    <circle cx="0" cy="26" r="2.5" fill="#d4d4d8" />
    <circle cx="10" cy="24" r="2.5" fill="#d4d4d8" />
    <circle cx="18" cy="20" r="2.5" fill="#d4d4d8" />
    <!-- Cross-section label -->
    <text x="0" y="-46" font-family="ui-sans-serif, system-ui" font-size="7" font-style="italic" fill="#444" text-anchor="middle">cable cross-section</text>
  </g>

  <!-- ── Mounting flange / anchor at base ── -->
  <rect x="175" y="600" width="120" height="50" fill="#3a3a3f" stroke="#000" stroke-width="0.6" />
  <!-- 4 anchor bolts visible in cross-section -->
  <rect x="182" y="610" width="6" height="40" fill="#1a1a1f" stroke="#888" stroke-width="0.3" />
  <rect x="220" y="610" width="6" height="40" fill="#1a1a1f" stroke="#888" stroke-width="0.3" />
  <rect x="240" y="610" width="6" height="40" fill="#1a1a1f" stroke="#888" stroke-width="0.3" />
  <rect x="278" y="610" width="6" height="40" fill="#1a1a1f" stroke="#888" stroke-width="0.3" />
  <text x="235" y="635" font-family="ui-sans-serif, system-ui" font-size="6" font-weight="bold" fill="#dde0e3" text-anchor="middle">4× M16 anchors</text>
  <!-- Bus + coolant exit through base -->
  <line x1="203" y1="600" x2="203" y2="650" stroke="#c97f3a" stroke-width="2" />
  <line x1="218" y1="600" x2="218" y2="650" stroke="#c97f3a" stroke-width="2" />
  <line x1="237" y1="600" x2="237" y2="650" stroke="#4a90c2" stroke-width="1.6" />
  <line x1="250" y1="600" x2="250" y2="650" stroke="#4a90c2" stroke-width="1.6" />

  <!-- ============================================================ -->
  <!-- THIN ANNOTATIONS                                              -->
  <!-- ============================================================ -->

  <text x="80" y="30" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">EXTERIOR</text>
  <text x="237" y="30" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">CUTAWAY</text>

  <!-- Note: "rectifier offboard" -->
  <text x="174" y="555" font-family="ui-sans-serif, system-ui" font-size="6" font-style="italic" fill="#444">AC-DC rectifier in offboard V4 cabinet</text>
  <text x="174" y="565" font-family="ui-sans-serif, system-ui" font-size="6" font-style="italic" fill="#444">(1.5 MW, shared 4-8 stalls)</text>

  <!-- Scale bar -->
  <line x1="14" y1="688" x2="48" y2="688" stroke="#555" stroke-width="1" />
  <text x="31" y="697" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~250 mm</text>

  <!-- Dimensions caption -->
  <text x="340" y="697" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">2.3 m tall · 500 kW peak · 1000 VDC</text>
</svg>
