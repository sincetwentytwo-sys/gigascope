name: Daily marketing drafts

# Runs every day at 09:00 UTC. Generates tweet drafts based on factories.json
# changes and weekday-scheduled content, then auto-posts up to N tweets to X
# (if X_AUTOPOST=1 and credentials are configured). All drafts also go to
# a GitHub Issue for review.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate drafts
        id: gen
        run: node scripts/marketing/generate.mjs

      - name: Random delay (0-45min) to avoid bot-like exact-hour posting
        if: github.event_name == 'schedule' && steps.gen.outputs.tweet_count != '0'
        run: sleep $((RANDOM % 2700))

      - name: Post to X (auto)
        id: post
        if: steps.gen.outputs.tweet_count != '0'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_AUTOPOST: ${{ secrets.X_AUTOPOST }}
          POST_LIMIT: "2"
        run: node scripts/marketing/post-to-x.mjs

      - name: Commit drafts and state
        if: steps.gen.outputs.tweet_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "marketing: daily drafts $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue with drafts
        if: steps.gen.outputs.tweet_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.gen.outputs.draft_path }}';
            const summary = '${{ steps.gen.outputs.summary }}';
            const postSummary = '${{ steps.post.outputs.summary || 'skipped' }}';
            const postedCount = '${{ steps.post.outputs.posted_count || '0' }}';
            const date = new Date().toISOString().slice(0, 10);
            let body = `Generated by daily-marketing workflow.\n\n**Drafts:** ${summary}\n**X auto-post:** ${postSummary} (${postedCount} posted)\n\n---\n\n`;
            try {
              body += fs.readFileSync(path, 'utf8');
            } catch (e) {
              body += `_(could not read ${path}: ${e.message})_`;
            }
            body += `\n\n---\nAny tweets not auto-posted are listed above for manual posting / scheduling. Close this issue when done.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tweet drafts — ${date}`,
              labels: ['marketing'],
              body,
            });
