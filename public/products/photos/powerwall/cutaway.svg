<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Powerwall 3 — schematic cutaway / front cross-section.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: left half shows the intact white wall-mount enclosure with
  the LED status bar at top and the TESLA wordmark; right half is sliced
  open on a jagged vertical cut to expose the four LFP modules, the
  thermal cold plate, the side cooling fins, the integrated PV+battery
  inverter behind the modules, and the AC/DC terminal panels at the
  bottom. Wall-mount bracket sits behind everything against the building
  wall (rendered as a hatched strip on the far right).

  Vertical aspect 400x600 mirrors the real 1.10 m x 0.61 m face — the
  unit is taller than wide. cutawayHotspot {x,y} in powerwall.ts targets
  this image in 0..1 normalized coords.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="pwShell" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fafafc" />
      <stop offset="80%" stop-color="#eaeaec" />
      <stop offset="100%" stop-color="#cccccf" />
    </linearGradient>
    <linearGradient id="pwModule" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a7ab0" />
      <stop offset="50%" stop-color="#2c5f8d" />
      <stop offset="100%" stop-color="#1c4060" />
    </linearGradient>
    <linearGradient id="pwInverter" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4f" />
      <stop offset="100%" stop-color="#28282d" />
    </linearGradient>
    <pattern id="wallHatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#b8a890" />
      <line x1="0" y1="0" x2="8" y2="8" stroke="#8c7e6a" stroke-width="0.4" />
    </pattern>
    <pattern id="pwCells" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" fill="#2c5f8d" />
      <rect x="0.5" y="0.5" width="2.2" height="5" fill="#3a7ab0" />
      <rect x="3.3" y="0.5" width="2.2" height="5" fill="#3a7ab0" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#f5f5f7" />

  <!-- Wall hatching (far right, behind the unit) -->
  <rect x="368" y="40" width="22" height="520" fill="url(#wallHatch)" stroke="#8c7e6a" stroke-width="0.4" />

  <!-- ============================================================ -->
  <!-- LEFT HALF — INTACT EXTERIOR                                  -->
  <!-- ============================================================ -->

  <!-- LED status bar at top of unit (light pipe across the front) -->
  <rect x="40" y="44" width="150" height="6" fill="#1a1a1f" stroke="#444" stroke-width="0.4" />
  <line x1="44" y1="47" x2="186" y2="47" stroke="#3a9ad9" stroke-width="1.2" opacity="0.85" />

  <!-- Body shell (powder-coated aluminum) -->
  <rect x="40" y="50" width="150" height="500" fill="url(#pwShell)" stroke="#888" stroke-width="0.8" />
  <!-- Top rounded edge accent -->
  <rect x="40" y="50" width="150" height="3" fill="#dddde0" />

  <!-- TESLA wordmark on front face (mid-height) -->
  <text x="115" y="285" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600" fill="#5a5a5e" text-anchor="middle" letter-spacing="3">TESLA</text>

  <!-- ============================================================ -->
  <!-- JAGGED CUT LINE (vertical between left and right halves)     -->
  <!-- ============================================================ -->
  <path d="M 190 50 L 196 65 L 190 80 L 196 95 L 190 110 L 196 125 L 190 140 L 196 155 L 190 170 L 196 185 L 190 200 L 196 215 L 190 230 L 196 245 L 190 260 L 196 275 L 190 290 L 196 305 L 190 320 L 196 335 L 190 350 L 196 365 L 190 380 L 196 395 L 190 410 L 196 425 L 190 440 L 196 455 L 190 470 L 196 485 L 190 500 L 196 515 L 190 530 L 196 545 L 190 550"
        fill="#555" stroke="#222" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- RIGHT HALF — CUTAWAY                                          -->
  <!-- ============================================================ -->

  <!-- Top edge of enclosure cut -->
  <rect x="196" y="44" width="172" height="6" fill="#1a1a1f" stroke="#444" stroke-width="0.4" />
  <line x1="200" y1="47" x2="364" y2="47" stroke="#3a9ad9" stroke-width="1.2" opacity="0.85" />

  <!-- Outer shell wall thickness (right side, cut to reveal interior) -->
  <rect x="358" y="50" width="10" height="500" fill="#cccccf" stroke="#888" stroke-width="0.5" />

  <!-- Right-side cooling fin (cast aluminum) -->
  <rect x="350" y="60" width="8" height="480" fill="#bcbcc0" stroke="#888" stroke-width="0.4" />
  <!-- fin ridges -->
  <line x1="354" y1="60" x2="354" y2="540" stroke="#9c9ca0" stroke-width="0.3" />

  <!-- Thermal management plate (vertical aluminum slab behind modules) -->
  <rect x="340" y="80" width="10" height="380" fill="#9aa0a6" stroke="#666" stroke-width="0.4" />

  <!-- LFP Module 1 (top-left of cutaway interior) -->
  <rect x="210" y="80" width="62" height="100" fill="url(#pwCells)" stroke="#1c4060" stroke-width="0.5" />
  <rect x="210" y="80" width="62" height="6" fill="#1c4060" />
  <text x="241" y="138" font-family="ui-sans-serif, system-ui" font-size="7" font-weight="600" fill="#dde0e3" text-anchor="middle">LFP 1</text>

  <!-- LFP Module 2 (top-right) -->
  <rect x="276" y="80" width="62" height="100" fill="url(#pwCells)" stroke="#1c4060" stroke-width="0.5" />
  <rect x="276" y="80" width="62" height="6" fill="#1c4060" />
  <text x="307" y="138" font-family="ui-sans-serif, system-ui" font-size="7" font-weight="600" fill="#dde0e3" text-anchor="middle">LFP 2</text>

  <!-- LFP Module 3 (middle-left) -->
  <rect x="210" y="186" width="62" height="100" fill="url(#pwCells)" stroke="#1c4060" stroke-width="0.5" />
  <rect x="210" y="186" width="62" height="6" fill="#1c4060" />
  <text x="241" y="244" font-family="ui-sans-serif, system-ui" font-size="7" font-weight="600" fill="#dde0e3" text-anchor="middle">LFP 3</text>

  <!-- LFP Module 4 (middle-right) -->
  <rect x="276" y="186" width="62" height="100" fill="url(#pwCells)" stroke="#1c4060" stroke-width="0.5" />
  <rect x="276" y="186" width="62" height="6" fill="#1c4060" />
  <text x="307" y="244" font-family="ui-sans-serif, system-ui" font-size="7" font-weight="600" fill="#dde0e3" text-anchor="middle">LFP 4</text>

  <!-- BMS / inter-module bus area (thin horizontal copper strap) -->
  <rect x="210" y="182" width="128" height="4" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.3" />

  <!-- Integrated PV+Battery Inverter (large block below the modules) -->
  <rect x="210" y="296" width="128" height="120" fill="url(#pwInverter)" stroke="#111" stroke-width="0.6" />
  <!-- Inverter heat-sink fins on the inside face -->
  <line x1="216" y1="300" x2="216" y2="412" stroke="#666" stroke-width="0.3" />
  <line x1="222" y1="300" x2="222" y2="412" stroke="#666" stroke-width="0.3" />
  <line x1="228" y1="300" x2="228" y2="412" stroke="#666" stroke-width="0.3" />
  <line x1="234" y1="300" x2="234" y2="412" stroke="#666" stroke-width="0.3" />
  <!-- Inverter PCB hint (copper traces) -->
  <rect x="244" y="306" width="88" height="50" fill="#1a3a1a" stroke="#0a2a0a" stroke-width="0.4" />
  <line x1="250" y1="320" x2="328" y2="320" stroke="#c97f3a" stroke-width="0.5" />
  <line x1="250" y1="332" x2="328" y2="332" stroke="#c97f3a" stroke-width="0.5" />
  <line x1="250" y1="344" x2="328" y2="344" stroke="#c97f3a" stroke-width="0.5" />
  <!-- DC link capacitors -->
  <circle cx="258" cy="382" r="8" fill="#3a3a3f" stroke="#111" stroke-width="0.4" />
  <circle cx="282" cy="382" r="8" fill="#3a3a3f" stroke="#111" stroke-width="0.4" />
  <circle cx="306" cy="382" r="8" fill="#3a3a3f" stroke="#111" stroke-width="0.4" />
  <text x="274" y="406" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">11.5 kW INVERTER  ·  PV + BATTERY</text>

  <!-- AC Output Panel (bottom-left compartment) -->
  <rect x="210" y="420" width="60" height="62" fill="#2a2a2f" stroke="#111" stroke-width="0.5" />
  <text x="240" y="437" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">AC OUT</text>
  <!-- terminal lugs -->
  <rect x="220" y="446" width="8" height="6" fill="#c97f3a" />
  <rect x="232" y="446" width="8" height="6" fill="#c97f3a" />
  <rect x="244" y="446" width="8" height="6" fill="#c97f3a" />
  <text x="240" y="464" font-family="ui-sans-serif, system-ui" font-size="5" fill="#888" text-anchor="middle">240 V split</text>
  <text x="240" y="472" font-family="ui-sans-serif, system-ui" font-size="5" fill="#888" text-anchor="middle">48 A</text>

  <!-- DC PV Input Panel (bottom-right compartment) -->
  <rect x="274" y="420" width="64" height="62" fill="#2a2a2f" stroke="#111" stroke-width="0.5" />
  <text x="306" y="437" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">DC PV IN</text>
  <!-- 6 string terminals -->
  <circle cx="284" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="294" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="304" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="314" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="324" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="334" cy="450" r="2.5" fill="#c97f3a" />
  <circle cx="284" cy="462" r="2.5" fill="#1a1a1f" />
  <circle cx="294" cy="462" r="2.5" fill="#1a1a1f" />
  <circle cx="304" cy="462" r="2.5" fill="#1a1a1f" />
  <circle cx="314" cy="462" r="2.5" fill="#1a1a1f" />
  <circle cx="324" cy="462" r="2.5" fill="#1a1a1f" />
  <circle cx="334" cy="462" r="2.5" fill="#1a1a1f" />
  <text x="306" y="478" font-family="ui-sans-serif, system-ui" font-size="5" fill="#888" text-anchor="middle">6 strings · 20 kW</text>

  <!-- Wall mount bracket (vertical bar between unit and wall) -->
  <rect x="340" y="60" width="6" height="480" fill="#5a5a5f" stroke="#333" stroke-width="0.4" />
  <!-- Lag bolt holes -->
  <circle cx="343" cy="80" r="1.8" fill="#1a1a1f" />
  <circle cx="343" cy="180" r="1.8" fill="#1a1a1f" />
  <circle cx="343" cy="300" r="1.8" fill="#1a1a1f" />
  <circle cx="343" cy="420" r="1.8" fill="#1a1a1f" />
  <circle cx="343" cy="520" r="1.8" fill="#1a1a1f" />

  <!-- Bottom edge -->
  <rect x="196" y="550" width="172" height="6" fill="#cccccf" stroke="#888" stroke-width="0.5" />

  <!-- Left-half bottom edge (intact) -->
  <rect x="40" y="550" width="150" height="6" fill="#dddde0" stroke="#888" stroke-width="0.5" />

  <!-- Side cooling fin on left (intact view, side surface visible from angle) -->
  <rect x="32" y="60" width="8" height="490" fill="#bcbcc0" stroke="#888" stroke-width="0.4" />

  <!-- ============================================================ -->
  <!-- LABELS                                                       -->
  <!-- ============================================================ -->
  <text x="115" y="585" font-family="ui-sans-serif, system-ui" font-size="10" font-style="italic" fill="#444" text-anchor="middle">EXTERIOR</text>
  <text x="275" y="585" font-family="ui-sans-serif, system-ui" font-size="10" font-style="italic" fill="#444" text-anchor="middle">CUTAWAY</text>

  <!-- Scale bar -->
  <line x1="20" y1="30" x2="50" y2="30" stroke="#555" stroke-width="1" />
  <text x="35" y="25" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~20 cm</text>

  <!-- Dimensions caption -->
  <text x="380" y="595" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">110 × 61 × 19 cm  ·  13.5 kWh  ·  11.5 kW</text>
</svg>
