<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system, system-ui, sans-serif">
  <rect width="1000" height="700" fill="#0f1117"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#e5e7eb">Oklo Aurora micro-reactor</text>
  <text x="32" y="62" font-size="13" fill="#9ca3af">Liquid-metal-cooled fast spectrum · 15-50 MWe per unit · HALEU fuel</text>
  <line x1="32" y1="78" x2="968" y2="78" stroke="#3a3f48" stroke-width="1"/>
  
  <g>
    <rect x="350" y="110" width="300" height="50" rx="6" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1.5"/>
    <text x="500" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Roof / A-frame structure</text>
    <text x="500" y="147" text-anchor="middle" font-size="11" fill="#9ca3af">site-built shelter</text>
  </g>

  
  <g>
    <rect x="380" y="170" width="240" height="220" rx="6" fill="#374151" fill-opacity="0.18" stroke="#374151" stroke-width="1.5"/>
    <text x="500" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Reactor vessel</text>
    
  </g>
  
  <g>
    <circle cx="500" cy="270" r="60" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#e5e7eb">Core</text>
    <text x="500" y="284" text-anchor="middle" font-size="10" fill="#9ca3af">HALEU 19.75%</text>
  </g>
  
  <g>
    <rect x="400" y="350" width="200" height="20" rx="6" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="500" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Control rods</text>
    
  </g>

  
  <g>
    <rect x="200" y="400" width="600" height="50" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="500" y="429" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Liquid-metal primary loop (Na or Pb)</text>
    
  </g>
  
  <g>
    <rect x="200" y="460" width="280" height="60" rx="6" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.5"/>
