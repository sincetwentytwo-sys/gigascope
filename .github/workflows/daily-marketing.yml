name: Daily marketing drafts

# Runs every day at 09:00 UTC. Generates tweet drafts based on factories.json
# changes and weekday-scheduled content. Commits drafts + opens an issue so
# the maintainer gets a notification.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate drafts
        id: gen
        run: node scripts/marketing/generate.mjs

      - name: Commit drafts and state
        if: steps.gen.outputs.tweet_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "marketing: daily drafts $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue with drafts
        if: steps.gen.outputs.tweet_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.gen.outputs.draft_path }}';
            const summary = '${{ steps.gen.outputs.summary }}';
            const date = new Date().toISOString().slice(0, 10);
            let body = `Generated by daily-marketing workflow.\n\n${summary}\n\n---\n\n`;
            try {
              body += fs.readFileSync(path, 'utf8');
            } catch (e) {
              body += `_(could not read ${path}: ${e.message})_`;
            }
            body += `\n\n---\nReview, edit, and post to X. Close this issue when done.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tweet drafts — ${date}`,
              labels: ['marketing'],
              body,
            });
