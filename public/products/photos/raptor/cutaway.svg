<?xml version="1.0" encoding="UTF-8"?>
<!--
  SpaceX Raptor (full-flow staged combustion methalox) — schematic cutaway.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: full engine silhouette drawn on the left side; the right side
  is sliced open to expose the two preburners, two turbopumps, hot-gas
  manifolds, injector plate, main chamber wall, throat, regen channels
  inside the bell, and the gimbal mount. Hotspots target this image via
  cutawayHotspot {x,y} in 0..1 normalized coords.

  viewBox 400x600 (aspect ~0.67) chosen to match the engine's vertical
  proportions — bell at bottom, powerhead at top.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bellSteel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5a5d66" />
      <stop offset="50%" stop-color="#9aa0a6" />
      <stop offset="100%" stop-color="#5a5d66" />
    </linearGradient>
    <linearGradient id="bellSteelCut" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#6a6d76" />
      <stop offset="100%" stop-color="#3a3d46" />
    </linearGradient>
    <linearGradient id="copperRegen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dca070" />
      <stop offset="100%" stop-color="#c97f3a" />
    </linearGradient>
    <linearGradient id="chamberHot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d97757" />
      <stop offset="100%" stop-color="#8a3a1a" />
    </linearGradient>
    <radialGradient id="oxPB" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#a7c4e0" />
      <stop offset="100%" stop-color="#4a90c2" />
    </radialGradient>
    <radialGradient id="fuelPB" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#e8a570" />
      <stop offset="100%" stop-color="#c97f3a" />
    </radialGradient>
    <pattern id="plumbing" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" fill="#3d3f45" />
      <line x1="0" y1="0" x2="6" y2="6" stroke="#5a5d66" stroke-width="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- LEFT HALF — INTACT EXTERIOR (engine silhouette)               -->
  <!-- ============================================================ -->

  <!-- Gimbal mount (top, intact) -->
  <ellipse cx="115" cy="50" rx="60" ry="8" fill="#9a9da5" stroke="#555" stroke-width="0.6" />
  <rect x="55" y="50" width="120" height="14" fill="#3a3c42" stroke="#555" stroke-width="0.6" />

  <!-- Powerhead bulge (turbopumps + preburners visible as outer shell) -->
  <path d="M 55 64 Q 25 80 25 130 Q 25 170 55 200 L 175 200 L 175 64 Z"
        fill="#46484e" stroke="#444" stroke-width="0.6" />
  <!-- External plumbing lumps on the left flank -->
  <circle cx="50" cy="100" r="14" fill="#5a5d66" stroke="#3a3c42" stroke-width="0.5" />
  <circle cx="40" cy="150" r="18" fill="#5a5d66" stroke="#3a3c42" stroke-width="0.5" />
  <!-- Sensors box -->
  <rect x="40" y="75" width="22" height="10" fill="#2a2c30" stroke="#1a1c20" stroke-width="0.4" />

  <!-- Chamber section (cylindrical, intact) -->
  <path d="M 55 200 L 175 200 L 175 280 L 55 280 Z" fill="#6b6e76" stroke="#444" stroke-width="0.6" />

  <!-- Bell nozzle (intact left half, flared cone) -->
  <path d="M 55 280 L 175 280 L 175 540 L 5 540 Z"
        fill="url(#bellSteel)" stroke="#444" stroke-width="0.8" />
  <!-- Vertical bell rib detail -->
  <line x1="40" y1="320" x2="20" y2="535" stroke="#3a3d46" stroke-width="0.5" />
  <line x1="80" y1="320" x2="55" y2="535" stroke="#3a3d46" stroke-width="0.5" />
  <line x1="120" y1="320" x2="105" y2="535" stroke="#3a3d46" stroke-width="0.5" />
  <line x1="160" y1="320" x2="155" y2="535" stroke="#3a3d46" stroke-width="0.5" />

  <!-- ============================================================ -->
  <!-- Jagged cut edge (vertical seam at x=175 / x=180)              -->
  <!-- ============================================================ -->
  <path d="M 175 50 L 180 65 L 175 80 L 180 95 L 175 110 L 180 125 L 175 140 L 180 155 L 175 170 L 180 185 L 175 200 L 180 215 L 175 230 L 180 245 L 175 260 L 180 275 L 175 290 L 180 305 L 175 320 L 180 335 L 175 350 L 180 365 L 175 380 L 180 395 L 175 410 L 180 425 L 175 440 L 180 455 L 175 470 L 180 485 L 175 500 L 180 515 L 175 530 L 180 540"
        fill="#555" stroke="#333" stroke-width="0.5" />

  <!-- ============================================================ -->
  <!-- RIGHT HALF — CUTAWAY (internals exposed)                      -->
  <!-- ============================================================ -->

  <!-- Gimbal mount cut (steel puck cross-section) -->
  <rect x="180" y="44" width="160" height="8" fill="#9a9da5" stroke="#444" stroke-width="0.5" />
  <rect x="180" y="52" width="160" height="14" fill="#3a3c42" stroke="#444" stroke-width="0.5" />
  <text x="260" y="40" font-family="ui-sans-serif, system-ui" font-size="6.5" fill="#444" text-anchor="middle">GIMBAL MOUNT</text>

  <!-- Hot-gas manifold cross-section (dark plenum behind preburners) -->
  <rect x="180" y="66" width="160" height="10" fill="#46484e" stroke="#222" stroke-width="0.5" />
  <text x="260" y="74" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#dde0e3" text-anchor="middle">HOT-GAS MANIFOLD</text>

  <!-- Oxidizer turbopump (right of cut, blue tint - LOX side) -->
  <rect x="290" y="80" width="50" height="60" fill="#7a9ec2" stroke="#2a5e88" stroke-width="0.7" rx="3" />
  <circle cx="315" cy="110" r="14" fill="#a7c4e0" stroke="#2a5e88" stroke-width="0.5" />
  <line x1="315" y1="96" x2="315" y2="124" stroke="#2a5e88" stroke-width="0.6" />
  <line x1="301" y1="110" x2="329" y2="110" stroke="#2a5e88" stroke-width="0.6" />
  <text x="315" y="155" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#2a5e88" text-anchor="middle">OX TURBOPUMP</text>

  <!-- Methane turbopump (left side of cut chamber, orange tint - fuel side) -->
  <rect x="185" y="80" width="48" height="58" fill="#c2a878" stroke="#7a4a20" stroke-width="0.7" rx="3" />
  <circle cx="209" cy="109" r="13" fill="#e8c8a0" stroke="#7a4a20" stroke-width="0.5" />
  <line x1="209" y1="96" x2="209" y2="122" stroke="#7a4a20" stroke-width="0.6" />
  <line x1="196" y1="109" x2="222" y2="109" stroke="#7a4a20" stroke-width="0.6" />
  <text x="209" y="155" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#7a4a20" text-anchor="middle">CH4 TURBOPUMP</text>

  <!-- Oxidizer preburner (LOX-rich, blue sphere cut) -->
  <ellipse cx="315" cy="170" rx="22" ry="18" fill="url(#oxPB)" stroke="#2a5e88" stroke-width="0.7" />
  <text x="315" y="172" font-family="ui-sans-serif, system-ui" font-size="5" fill="#fff" text-anchor="middle">OX PB</text>

  <!-- Fuel preburner (fuel-rich, orange sphere cut) -->
  <ellipse cx="209" cy="170" rx="22" ry="18" fill="url(#fuelPB)" stroke="#7a4a20" stroke-width="0.7" />
  <text x="209" y="172" font-family="ui-sans-serif, system-ui" font-size="5" fill="#fff" text-anchor="middle">FUEL PB</text>

  <!-- Sensors box (small dark rectangle on the right flank) -->
  <rect x="325" y="195" width="14" height="8" fill="#2a2c30" stroke="#1a1c20" stroke-width="0.3" />
  <circle cx="332" cy="199" r="1.2" fill="#d4b020" />

  <!-- Spark torch igniter (yellow dot near chamber/injector) -->
  <rect x="300" y="220" width="3" height="14" fill="#d4b020" stroke="#7a6010" stroke-width="0.3" />

  <!-- Hot-gas manifold (dark plenum routing PB exhaust down to injector) -->
  <path d="M 180 190 L 340 190 L 340 215 L 180 215 Z" fill="url(#plumbing)" stroke="#1a1c20" stroke-width="0.5" />

  <!-- Coaxial injector plate -->
  <rect x="180" y="215" width="160" height="12" fill="#2a2c30" stroke="#000" stroke-width="0.6" />
  <!-- Injector element dots -->
  <g fill="#5a5d66">
    <circle cx="195" cy="221" r="1.2" /><circle cx="205" cy="221" r="1.2" /><circle cx="215" cy="221" r="1.2" />
    <circle cx="225" cy="221" r="1.2" /><circle cx="235" cy="221" r="1.2" /><circle cx="245" cy="221" r="1.2" />
    <circle cx="255" cy="221" r="1.2" /><circle cx="265" cy="221" r="1.2" /><circle cx="275" cy="221" r="1.2" />
    <circle cx="285" cy="221" r="1.2" /><circle cx="295" cy="221" r="1.2" /><circle cx="305" cy="221" r="1.2" />
    <circle cx="315" cy="221" r="1.2" /><circle cx="325" cy="221" r="1.2" />
  </g>
  <text x="260" y="240" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#444" text-anchor="middle">COAXIAL INJECTOR PLATE</text>

  <!-- Combustion chamber wall (cut, SX300 copper liner showing) -->
  <rect x="180" y="245" width="160" height="55" fill="url(#chamberHot)" stroke="#7a3010" stroke-width="0.6" />
  <!-- Inner liner detail -->
  <rect x="185" y="247" width="150" height="3" fill="#c97f3a" />
  <rect x="185" y="297" width="150" height="3" fill="#c97f3a" />
  <!-- Hot gas swirl lines -->
  <path d="M 200 265 Q 230 270 260 265 Q 290 260 320 265" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.5" />
  <path d="M 200 280 Q 230 285 260 280 Q 290 275 320 280" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.5" />
  <text x="260" y="280" font-family="ui-sans-serif, system-ui" font-size="6" fill="#fff" text-anchor="middle" opacity="0.85">CHAMBER 300 bar</text>

  <!-- Throat (constriction at base of chamber) -->
  <path d="M 180 300 L 200 315 L 320 315 L 340 300 Z" fill="#5a1010" stroke="#220500" stroke-width="0.7" />
  <text x="260" y="312" font-family="ui-sans-serif, system-ui" font-size="6" fill="#fff" text-anchor="middle">THROAT</text>

  <!-- Bell nozzle cut — diverging cone with regen channels -->
  <path d="M 200 315 L 320 315 L 395 540 L 180 540 Z"
        fill="url(#bellSteelCut)" stroke="#3a3d46" stroke-width="0.8" />

  <!-- Regen-cooling channels (copper veins running down inside the bell wall) -->
  <g stroke="url(#copperRegen)" stroke-width="2.2" fill="none" opacity="0.95">
    <path d="M 205 320 L 195 540" />
    <path d="M 220 320 L 230 540" />
    <path d="M 240 320 L 260 540" />
    <path d="M 260 320 L 290 540" />
    <path d="M 280 320 L 320 540" />
    <path d="M 300 320 L 350 540" />
    <path d="M 318 320 L 380 540" />
  </g>
  <!-- Copper accent stripe near throat (regen channel inlets) -->
  <rect x="200" y="316" width="120" height="4" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />

  <text x="285" y="450" font-family="ui-sans-serif, system-ui" font-size="6.5" fill="#dde0e3" text-anchor="middle" opacity="0.9">REGEN CHANNELS</text>
  <text x="285" y="500" font-family="ui-sans-serif, system-ui" font-size="6.5" fill="#dde0e3" text-anchor="middle" opacity="0.9">EXPANSION NOZZLE</text>

  <!-- ============================================================ -->
  <!-- THIN ANNOTATIONS                                              -->
  <!-- ============================================================ -->

  <text x="100" y="565" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444" text-anchor="middle">EXTERIOR</text>
  <text x="280" y="565" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444" text-anchor="middle">CUTAWAY</text>

  <!-- Dimensions caption -->
  <text x="380" y="595" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">~3.1 m tall × 1.3 m bell dia</text>
</svg>
