<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system, system-ui, sans-serif">
  <rect width="1000" height="700" fill="#0f1117"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#e5e7eb">ASML TWINSCAN EXE:5000 (High-NA EUV)</text>
  <text x="32" y="62" font-size="13" fill="#9ca3af">0.55 NA · 13.5 nm wavelength · ~$380M per system</text>
  <line x1="32" y1="78" x2="968" y2="78" stroke="#3a3f48" stroke-width="1"/>
  
  <g>
    <rect x="60" y="150" width="180" height="100" rx="6" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
    <text x="150" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">CO₂ laser source</text>
    <text x="150" y="212" text-anchor="middle" font-size="11" fill="#9ca3af">Cymer LPP</text>
  </g>
  
  <g>
    <rect x="280" y="150" width="160" height="100" rx="6" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="360" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Tin droplet plasma</text>
    <text x="360" y="212" text-anchor="middle" font-size="11" fill="#9ca3af">50,000/sec</text>
  </g>
  
  <g>
    <rect x="480" y="150" width="160" height="100" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="560" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Collector mirror</text>
    <text x="560" y="212" text-anchor="middle" font-size="11" fill="#9ca3af">Mo/Si multilayer</text>
  </g>

  
  <g>
    <rect x="680" y="100" width="260" height="200" rx="6" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.5"/>
    <text x="810" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Illumination + projection</text>
    <text x="810" y="212" text-anchor="middle" font-size="11" fill="#9ca3af">Zeiss SMT mirrors</text>
  </g>

  
  <g>
    <rect x="280" y="380" width="250" height="110" rx="6" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1.5"/>
    <text x="405" y="427" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Reticle stage</text>
    <text x="405" y="447" text-anchor="middle" font-size="11" fill="#9ca3af">EUV mask</text>
  </g>
  
  <g>
    <rect x="570" y="380" width="320" height="200" rx="6" fill="#0066cc" fill-opacity="0.18" stroke="#0066cc" stroke-width="1.5"/>
    <text x="730" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Wafer stage</text>
    <text x="730" y="492" text-anchor="middle" font-size="11" fill="#9ca3af">300 mm wafer · dual-stage</text>
  </g>

  <line x1="240" y1="200" x2="280" y2="200" stroke="#3a3f48" stroke-width="2"/>
  <line x1="440" y1="200" x2="480" y2="200" stroke="#3a3f48" stroke-width="2"/>
  <line x1="640" y1="200" x2="680" y2="200" stroke="#3a3f48" stroke-width="2"/>
  <line x1="810" y1="300" x2="810" y2="380" stroke="#3a3f48" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="820" y="350" font-size="10" fill="#9ca3af">EUV beam path</text>

  
  <g>
    <rect x="60" y="380" width="180" height="200" rx="6" fill="#9ca3af" fill-opacity="0.18" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="150" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Vacuum chamber + frame</text>
    <text x="150" y="492" text-anchor="middle" font-size="11" fill="#9ca3af">EUV requires vacuum</text>
  </g>
<text x="968" y="688" text-anchor="end" font-size="10" fill="#9ca3af">Schematic — gigascope.xyz</text>
</svg>