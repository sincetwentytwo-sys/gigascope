<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Model 3 (Highland) — top-down cutaway / interior layout.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: bird's-eye view with the roof removed so cabin seating,
  drive units, battery pack and cameras are exposed. The body outline is
  drawn in light gray; internal hardware is filled per palette. Front of
  car is at the LEFT of the canvas; rear at the RIGHT. Hotspots in
  model-3.ts target this image via cutawayHotspot {x,y} in 0..1
  normalized coords.

  viewBox 800x315 matches the real 4694mm L x 1850mm W sedan aspect ratio
  (~2.54). The silhouette fills ~90% of the canvas height so that all
  hotspot dots sit on visible vehicle parts, not in empty bands.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 0 800 315" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="m3body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dde0e3" />
      <stop offset="100%" stop-color="#b8bcc2" />
    </linearGradient>
    <linearGradient id="m3glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a7c4e0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6d8aa8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="m3pack" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3a5e80" />
      <stop offset="50%" stop-color="#4a90c2" />
      <stop offset="100%" stop-color="#3a5e80" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="315" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- BODY OUTLINE (top-down silhouette, sedan profile)             -->
  <!-- ============================================================ -->
  <!-- Sedan plan: tapered nose at left, rounded tail at right.     -->
  <path d="M 60 157
           C 75 60, 130 25, 200 20
           L 600 20
           C 660 20, 720 40, 740 75
           L 745 157
           L 740 240
           C 720 275, 660 295, 600 295
           L 200 295
           C 130 290, 75 255, 60 157 Z"
        fill="url(#m3body)" stroke="#555" stroke-width="1.2" />

  <!-- Hood / frunk area (front fascia line) -->
  <line x1="180" y1="30" x2="180" y2="285" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2" />
  <text x="120" y="180" font-family="ui-sans-serif, system-ui" font-size="9" fill="#666" text-anchor="middle">FRUNK</text>

  <!-- Windshield arc (from cowl to roof) -->
  <path d="M 220 45 Q 245 157 220 270" stroke="url(#m3glass)" stroke-width="14" fill="none" opacity="0.75" />

  <!-- Glass roof panel (cabin opening) -->
  <rect x="245" y="55" width="285" height="205" fill="url(#m3glass)" opacity="0.45" stroke="#7a98b8" stroke-width="0.6" stroke-dasharray="2 2" />

  <!-- Rear glass / hatch line -->
  <path d="M 540 55 Q 565 157 540 260" stroke="url(#m3glass)" stroke-width="12" fill="none" opacity="0.7" />

  <!-- Trunk lid area -->
  <line x1="605" y1="40" x2="605" y2="280" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2" />
  <text x="665" y="180" font-family="ui-sans-serif, system-ui" font-size="9" fill="#666" text-anchor="middle">TRUNK</text>

  <!-- Front bumper / nose line -->
  <line x1="78" y1="110" x2="78" y2="200" stroke="#888" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- ============================================================ -->
  <!-- WHEELS (4) — dark tire ovals at corners                       -->
  <!-- ============================================================ -->
  <ellipse cx="195" cy="20" rx="34" ry="16" fill="#2a2a2a" stroke="#111" stroke-width="0.8" />
  <ellipse cx="195" cy="295" rx="34" ry="16" fill="#2a2a2a" stroke="#111" stroke-width="0.8" />
  <ellipse cx="615" cy="20" rx="34" ry="16" fill="#2a2a2a" stroke="#111" stroke-width="0.8" />
  <ellipse cx="615" cy="295" rx="34" ry="16" fill="#2a2a2a" stroke="#111" stroke-width="0.8" />
  <!-- Wheel rim accent -->
  <ellipse cx="195" cy="20" rx="20" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="195" cy="295" rx="20" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="615" cy="20" rx="20" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="615" cy="295" rx="20" ry="10" fill="none" stroke="#888" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- DRIVE UNITS (front induction + rear PMSM)                    -->
  <!-- ============================================================ -->
  <rect x="155" y="120" width="55" height="70" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="183" y="148" font-family="ui-sans-serif, system-ui" font-size="7" fill="#dde0e3" text-anchor="middle">FRONT</text>
  <text x="183" y="172" font-family="ui-sans-serif, system-ui" font-size="7" fill="#dde0e3" text-anchor="middle">INDUCT.</text>

  <rect x="595" y="120" width="55" height="70" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="623" y="148" font-family="ui-sans-serif, system-ui" font-size="7" fill="#dde0e3" text-anchor="middle">REAR</text>
  <text x="623" y="172" font-family="ui-sans-serif, system-ui" font-size="7" fill="#dde0e3" text-anchor="middle">PMSM</text>

  <!-- ============================================================ -->
  <!-- STRUCTURAL BATTERY PACK (2170 cells, between axles)          -->
  <!-- ============================================================ -->
  <rect x="220" y="60" width="370" height="195" fill="url(#m3pack)" stroke="#1a3050" stroke-width="1" opacity="0.55" rx="4" />
  <!-- Cell-grid texture -->
  <g stroke="#1a3050" stroke-width="0.4" opacity="0.4">
    <line x1="220" y1="100" x2="590" y2="100" />
    <line x1="220" y1="140" x2="590" y2="140" />
    <line x1="220" y1="180" x2="590" y2="180" />
    <line x1="220" y1="215" x2="590" y2="215" />
    <line x1="260" y1="60" x2="260" y2="255" />
    <line x1="300" y1="60" x2="300" y2="255" />
    <line x1="340" y1="60" x2="340" y2="255" />
    <line x1="380" y1="60" x2="380" y2="255" />
    <line x1="420" y1="60" x2="420" y2="255" />
    <line x1="460" y1="60" x2="460" y2="255" />
    <line x1="500" y1="60" x2="500" y2="255" />
    <line x1="540" y1="60" x2="540" y2="255" />
  </g>
  <text x="405" y="160" font-family="ui-sans-serif, system-ui" font-size="9" fill="#0a2240" text-anchor="middle" font-weight="600">2170 PACK · 75 kWh</text>

  <!-- ============================================================ -->
  <!-- CABIN: front-row seats (driver/passenger) + rear bench        -->
  <!-- ============================================================ -->
  <!-- Top half = pass-side (driver-RIGHT in LHD); bottom = driver -->
  <rect x="280" y="70" width="42" height="62" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="280" y="183" width="42" height="62" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="301" y="105" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">PASS</text>
  <text x="301" y="218" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">DRIVER</text>

  <!-- Center 15" touchscreen (between front seats, landscape) -->
  <rect x="332" y="146" width="30" height="22" fill="#0a0a12" stroke="#444" stroke-width="0.5" rx="2" />
  <rect x="335" y="149" width="24" height="16" fill="#2a3a5a" opacity="0.7" />
  <text x="347" y="139" font-family="ui-sans-serif, system-ui" font-size="6" fill="#666" text-anchor="middle">15"</text>

  <!-- Rear bench seat (3-up) -->
  <rect x="430" y="65" width="135" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="430" y="170" width="135" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="497" y="110" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">REAR BENCH</text>

  <!-- ============================================================ -->
  <!-- CAMERAS / SENSORS                                             -->
  <!-- ============================================================ -->
  <!-- Front trifocal cluster (windshield-top, behind mirror) - drawn at arc -->
  <circle cx="240" cy="120" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="240" cy="157" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="240" cy="194" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="252" y="160" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">trifocal</text>

  <!-- B-pillar cameras (top = R, bottom = L for driver perspective) -->
  <circle cx="380" cy="40" r="4" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="380" cy="275" r="4" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="388" y="38" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">B-pillar R</text>
  <text x="388" y="287" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">B-pillar L</text>

  <!-- HEPA cabin filter (relocated below trifocal, on driver-side dash) -->
  <rect x="262" y="213" width="22" height="14" fill="#3d3a32" stroke="#222" stroke-width="0.5" rx="1" />
  <text x="273" y="208" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle">HEPA</text>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                   -->
  <!-- ============================================================ -->
  <text x="400" y="11" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444" text-anchor="middle">TOP-DOWN · INTERIOR LAYOUT  ·  FRONT ← / → REAR</text>

  <!-- Scale bar at bottom -->
  <line x1="60" y1="312" x2="160" y2="312" stroke="#555" stroke-width="0.7" />
  <text x="110" y="309" font-family="ui-monospace, monospace" font-size="6" fill="#555" text-anchor="middle">~1 m (to scale)</text>

  <!-- Dimensions caption -->
  <text x="740" y="312" font-family="ui-monospace, monospace" font-size="6" fill="#555" text-anchor="end">4694 mm L × 1850 mm W</text>
</svg>
