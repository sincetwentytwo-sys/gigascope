<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Cybertruck — top-down cutaway / interior layout.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: bird's-eye view with the roof and tonneau opened up to show
  cabin seating, drive units, ~123 kWh 4680 structural pack, steer-by-wire
  actuators, rear-axle steering motor, and the bed (vault). Front of truck
  at LEFT, rear at RIGHT.

  Exoskeleton panel seams visible — Cybertruck's stainless body is drawn
  in long straight creases because cold-rolled stainless can't form
  compound curves.

  viewBox 800x310 matches the real 5683mm L x 2200mm W truck aspect ratio
  (~2.58). The silhouette fills ~90% of canvas height so all cutaway
  hotspot dots sit on visible vehicle parts, not in empty bands.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ctbody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfd3d8" />
      <stop offset="100%" stop-color="#9ea4ab" />
    </linearGradient>
    <linearGradient id="ctglass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a7c4e0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6d8aa8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="ctpack" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3a5e80" />
      <stop offset="50%" stop-color="#4a90c2" />
      <stop offset="100%" stop-color="#3a5e80" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="310" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- EXOSKELETON OUTLINE — straight panel creases, no compound     -->
  <!-- curves possible at 30X stainless hardness                      -->
  <!-- ============================================================ -->
  <path d="M 60 155
           L 95 38
           L 175 18
           L 705 18
           L 740 55
           L 740 255
           L 705 292
           L 175 292
           L 95 272
           Z"
        fill="url(#ctbody)" stroke="#444" stroke-width="1.6" />

  <!-- Panel seam lines (straight, never curved — 30X cold-roll constraint) -->
  <g stroke="#666" stroke-width="0.6" stroke-dasharray="4 3">
    <line x1="175" y1="18" x2="175" y2="292" /> <!-- front A-pillar seam -->
    <line x1="290" y1="18" x2="290" y2="292" /> <!-- A-pillar / windshield base -->
    <line x1="440" y1="18" x2="440" y2="292" /> <!-- B-pillar / cab-to-bed seam -->
    <line x1="705" y1="18" x2="705" y2="292" /> <!-- tailgate seam -->
  </g>

  <!-- Front wedge / hood label area -->
  <text x="135" y="155" font-family="ui-sans-serif, system-ui" font-size="9" fill="#444" text-anchor="middle">FRUNK</text>
  <text x="135" y="167" font-family="ui-sans-serif, system-ui" font-size="6" fill="#666" text-anchor="middle">(wedge)</text>

  <!-- Front lightbar (LED matrix strip at leading edge) -->
  <rect x="62" y="125" width="6" height="60" fill="#fafafa" stroke="#fff4d8" stroke-width="0.6" rx="2" />
  <!-- Rear lightbar (red LED strip at tail) -->
  <rect x="732" y="125" width="6" height="60" fill="#3a0808" stroke="#a02020" stroke-width="0.5" rx="2" />

  <!-- Windshield arc (large, single piece, ~1.3m wiper blade) -->
  <path d="M 195 38 Q 245 155 195 272" stroke="url(#ctglass)" stroke-width="16" fill="none" opacity="0.75" />

  <!-- Cabin glass (overhead — no panoramic, just a glass back) -->
  <rect x="295" y="30" width="140" height="250" fill="url(#ctglass)" opacity="0.35" stroke="#7a98b8" stroke-width="0.6" stroke-dasharray="2 2" />

  <!-- ============================================================ -->
  <!-- BED / VAULT (rear) — composite floor over stainless tub        -->
  <!-- ============================================================ -->
  <rect x="445" y="30" width="255" height="250" fill="#9ea4ab" stroke="#555" stroke-width="0.6" opacity="0.6" />
  <text x="572" y="50" font-family="ui-sans-serif, system-ui" font-size="9" fill="#222" text-anchor="middle" font-weight="600">BED (VAULT)</text>
  <text x="572" y="62" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle">1.83m × 1.55m</text>

  <!-- Tonneau cover (three-segment, drawn as segmented overlay on bed) -->
  <g opacity="0.55" stroke="#222" stroke-width="0.6">
    <rect x="445" y="120" width="85" height="70" fill="#2a2d33" />
    <rect x="530" y="120" width="85" height="70" fill="#2a2d33" />
    <rect x="615" y="120" width="85" height="70" fill="#2a2d33" />
  </g>
  <text x="572" y="158" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle" font-style="italic">tonneau (3 segments)</text>

  <!-- Powershare outlets (120V / 240V) markers on bed wall -->
  <circle cx="475" cy="225" r="3" fill="#d4a017" stroke="#666" stroke-width="0.4" />
  <circle cx="490" cy="225" r="3" fill="#d4a017" stroke="#666" stroke-width="0.4" />
  <text x="485" y="245" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">9.6 kW outlets</text>

  <!-- ============================================================ -->
  <!-- WHEELS (4) — large 35" all-terrain tires                       -->
  <!-- ============================================================ -->
  <ellipse cx="225" cy="18" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="225" cy="292" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="645" cy="18" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="645" cy="292" rx="38" ry="18" fill="#1a1a1f" stroke="#000" stroke-width="0.8" />
  <ellipse cx="225" cy="18" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="225" cy="292" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="645" cy="18" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="645" cy="292" rx="22" ry="11" fill="none" stroke="#888" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- DRIVE UNITS — Cyberbeast tri-motor: 1 front + 2 rear           -->
  <!-- ============================================================ -->
  <rect x="195" y="125" width="60" height="60" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="225" y="152" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">FRONT DU</text>
  <text x="225" y="162" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">262 hp</text>

  <!-- Dual rear drive units (Cyberbeast) -->
  <rect x="615" y="92" width="60" height="50" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="645" y="113" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">REAR R</text>
  <text x="645" y="124" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">286 hp</text>

  <rect x="615" y="168" width="60" height="50" fill="#3a3f47" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="645" y="189" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">REAR L</text>
  <text x="645" y="200" font-family="ui-sans-serif, system-ui" font-size="6" fill="#dde0e3" text-anchor="middle">286 hp</text>

  <!-- ============================================================ -->
  <!-- STEER-BY-WIRE ACTUATORS (front L + R) — at wedge front corners -->
  <!-- ============================================================ -->
  <rect x="135" y="52" width="20" height="14" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="145" y="48" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">SbW R</text>
  <rect x="135" y="244" width="20" height="14" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="145" y="268" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">SbW L</text>

  <!-- Rear-axle steering motor (behind right rear DU, near tailgate) -->
  <rect x="688" y="55" width="20" height="14" fill="#52575f" stroke="#222" stroke-width="0.4" rx="1" />
  <text x="698" y="50" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">REAR-STEER</text>

  <!-- ============================================================ -->
  <!-- 4680 STRUCTURAL HV PACK (under floor, spans wheelbase)         -->
  <!-- ============================================================ -->
  <rect x="260" y="50" width="350" height="210" fill="url(#ctpack)" stroke="#1a3050" stroke-width="1" opacity="0.55" rx="4" />
  <g stroke="#1a3050" stroke-width="0.4" opacity="0.4">
    <line x1="260" y1="90" x2="610" y2="90" />
    <line x1="260" y1="130" x2="610" y2="130" />
    <line x1="260" y1="170" x2="610" y2="170" />
    <line x1="260" y1="210" x2="610" y2="210" />
    <line x1="300" y1="50" x2="300" y2="260" />
    <line x1="340" y1="50" x2="340" y2="260" />
    <line x1="380" y1="50" x2="380" y2="260" />
    <line x1="420" y1="50" x2="420" y2="260" />
    <line x1="460" y1="50" x2="460" y2="260" />
    <line x1="500" y1="50" x2="500" y2="260" />
    <line x1="540" y1="50" x2="540" y2="260" />
    <line x1="580" y1="50" x2="580" y2="260" />
  </g>
  <text x="435" y="260" font-family="ui-sans-serif, system-ui" font-size="8" fill="#0a2240" text-anchor="middle" font-weight="600">4680 STRUCTURAL · ~123 kWh · 400/800V multiplex</text>

  <!-- ============================================================ -->
  <!-- CABIN: front + rear bench (5 seats)                            -->
  <!-- ============================================================ -->
  <!-- Front-row seats -->
  <rect x="305" y="55" width="42" height="65" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="305" y="190" width="42" height="65" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="326" y="90" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">PASS</text>
  <text x="326" y="225" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">DRIVER</text>

  <!-- Yoke / no-column (steer-by-wire) -->
  <rect x="335" y="148" width="18" height="12" fill="#0a0a10" stroke="#444" stroke-width="0.5" rx="1" />
  <text x="344" y="146" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">yoke</text>

  <!-- Center 18.5" touchscreen -->
  <rect x="358" y="148" width="35" height="24" fill="#0a0a12" stroke="#444" stroke-width="0.5" rx="2" />
  <rect x="361" y="151" width="29" height="18" fill="#2a3a5a" opacity="0.7" />
  <text x="375" y="182" font-family="ui-sans-serif, system-ui" font-size="6" fill="#666" text-anchor="middle">18.5"</text>

  <!-- Rear bench -->
  <rect x="395" y="50" width="40" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="395" y="180" width="40" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="415" y="90" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">REAR</text>
  <text x="415" y="230" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">REAR</text>

  <!-- ============================================================ -->
  <!-- 48V LV BUS — yellow ribbon along chassis spine                 -->
  <!-- ============================================================ -->
  <rect x="180" y="155" width="525" height="4" fill="#d4a017" stroke="#7a5a08" stroke-width="0.4" opacity="0.85" />
  <text x="440" y="151" font-family="ui-sans-serif, system-ui" font-size="6" fill="#7a5a08" text-anchor="middle" font-style="italic">48V CAN-FD backbone</text>

  <!-- ============================================================ -->
  <!-- CAMERAS / SENSORS                                              -->
  <!-- ============================================================ -->
  <!-- Front trifocal (windshield, stacked along arc) -->
  <circle cx="245" cy="125" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="245" cy="155" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="245" cy="185" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="258" y="158" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">trifocal</text>

  <!-- Side cameras (B-pillar) -->
  <circle cx="440" cy="36" r="4" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <circle cx="440" cy="274" r="4" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="450" y="34" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">side R</text>
  <text x="450" y="286" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">side L</text>

  <!-- Rear camera (tailgate, lower-right) -->
  <circle cx="696" cy="248" r="3.5" fill="#0a0a0a" stroke="#666" stroke-width="0.4" />
  <text x="688" y="262" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="end">rear cam</text>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                    -->
  <!-- ============================================================ -->
  <text x="400" y="11" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444" text-anchor="middle">TOP-DOWN · CYBERBEAST TRI-MOTOR  ·  FRONT ← / → REAR</text>

  <line x1="60" y1="306" x2="160" y2="306" stroke="#555" stroke-width="0.7" />
  <text x="110" y="303" font-family="ui-monospace, monospace" font-size="6" fill="#555" text-anchor="middle">~1 m (to scale)</text>

  <text x="740" y="303" font-family="ui-monospace, monospace" font-size="6" fill="#555" text-anchor="end">5683 mm L × 2200 mm W</text>
</svg>
