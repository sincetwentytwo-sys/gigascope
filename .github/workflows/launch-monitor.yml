name: SpaceX launch monitor

# Runs hourly. Detects upcoming SpaceX launches via Launch Library 2 and
# generates time-sensitive tweet drafts (T-24h, T-1h, post-launch). All
# launch alerts auto-post immediately (no rate limit) since they are time
# sensitive. Skips already-announced launches via state file.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run launch monitor
        id: mon
        run: node scripts/marketing/launch-monitor.mjs

      - name: Post launch alerts to X
        id: post
        if: steps.mon.outputs.tweet_count != '0'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_AUTOPOST: ${{ secrets.X_AUTOPOST }}
          POST_LIMIT: "5"
          DRAFT_FILE: ${{ steps.mon.outputs.draft_path }}
        run: node scripts/marketing/post-to-x.mjs

      - name: Commit drafts and state
        if: steps.mon.outputs.tweet_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "marketing: launch alert $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Open urgent issue for launch alert
        if: steps.mon.outputs.tweet_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.mon.outputs.draft_path }}';
            const summary = '${{ steps.mon.outputs.summary }}';
            const postSummary = '${{ steps.post.outputs.summary || "skipped" }}';
            const postedCount = '${{ steps.post.outputs.posted_count || "0" }}';
            let body = `🚀 Launch alert.\n\n**Detected:** ${summary}\n**Auto-posted to X:** ${postSummary} (${postedCount})\n\n---\n\n`;
            try {
              body += fs.readFileSync(path, 'utf8');
            } catch (e) {
              body += `_(could not read ${path}: ${e.message})_`;
            }
            body += `\n\n---\nTime-sensitive: any tweets not auto-posted should be posted to X soon.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Launch alert — ${new Date().toISOString().slice(0, 16)}`,
              labels: ['marketing', 'launch-alert'],
              body,
            });
