<?xml version="1.0" encoding="UTF-8"?>
<!--
  Neuralink N1 implant — schematic cutaway / side cross-section.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: left half shows the intact disc sitting flush in a skull
  recess (scalp lifted away), right half shows the disc cut away to
  expose the inductive coil, ASIC die, lithium cell, hermetic feed-
  through ring, surgical-robot reference marker, and the 64 polymer
  threads exiting the dura into cortex below. Hotspots in
  neuralink-n1.ts target this image via cutawayHotspot {x,y} in 0..1
  normalized coords.

  viewBox 600x500. The puck itself sits in the upper third; the lower
  two-thirds is brain/cortex showing the thread tassel descending into
  layer V of motor cortex.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="titanShell" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7c8087" />
      <stop offset="40%" stop-color="#c8ccd1" />
      <stop offset="100%" stop-color="#7c8087" />
    </linearGradient>
    <linearGradient id="titanLid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dde0e3" />
      <stop offset="100%" stop-color="#9aa0a6" />
    </linearGradient>
    <linearGradient id="boneFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8e0c8" />
      <stop offset="100%" stop-color="#b8a878" />
    </linearGradient>
    <linearGradient id="cortex" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d6a8a0" />
      <stop offset="100%" stop-color="#9c6860" />
    </linearGradient>
    <radialGradient id="coilRing" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0d683" />
      <stop offset="100%" stop-color="#c97f3a" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- TOP LAYER GUIDE — scalp + skull + dura (very faint)            -->
  <!-- ============================================================ -->

  <!-- Skull bone band (drawn as a wide layer that the puck sits in) -->
  <rect x="0" y="120" width="600" height="38" fill="url(#boneFill)" opacity="0.45" />
  <!-- Dura mater (thin grey membrane just below skull) -->
  <rect x="0" y="158" width="600" height="6" fill="#888477" opacity="0.6" />
  <!-- Cortex (motor cortex layers) -->
  <rect x="0" y="164" width="600" height="200" fill="url(#cortex)" opacity="0.55" />
  <!-- Subtle cortical layer banding -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#aa7770" stroke-width="0.4" stroke-dasharray="4 6" opacity="0.5" />
  <line x1="0" y1="240" x2="600" y2="240" stroke="#aa7770" stroke-width="0.4" stroke-dasharray="4 6" opacity="0.5" />
  <line x1="0" y1="290" x2="600" y2="290" stroke="#aa7770" stroke-width="0.4" stroke-dasharray="4 6" opacity="0.5" />
  <text x="12" y="198" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" opacity="0.6">layer I-II</text>
  <text x="12" y="238" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" opacity="0.6">layer III-IV</text>
  <text x="12" y="288" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" opacity="0.6">layer V</text>

  <!-- ============================================================ -->
  <!-- LEFT HALF — INTACT EXTERIOR PUCK (flush with skull)            -->
  <!-- ============================================================ -->

  <!-- Top hermetic lid (intact) -->
  <ellipse cx="180" cy="120" rx="120" ry="14" fill="url(#titanLid)" stroke="#5a5e64" stroke-width="0.8" />
  <!-- Puck side wall (left half exterior) -->
  <rect x="60" y="120" width="240" height="42" fill="url(#titanShell)" stroke="#555" stroke-width="0.8" />
  <!-- Bottom curve of puck (intact dome facing dura) -->
  <ellipse cx="180" cy="162" rx="120" ry="6" fill="#7c8087" stroke="#555" stroke-width="0.6" />
  <!-- Skull flange shadow -->
  <line x1="60" y1="158" x2="300" y2="158" stroke="#3a3a3f" stroke-width="0.6" opacity="0.4" />

  <!-- Surgical-robot reference markers (fiducials on top lid) -->
  <circle cx="120" cy="115" r="2.4" fill="#1a1a1f" stroke="#666" stroke-width="0.3" />
  <circle cx="180" cy="113" r="2.4" fill="#1a1a1f" stroke="#666" stroke-width="0.3" />
  <circle cx="240" cy="115" r="2.4" fill="#1a1a1f" stroke="#666" stroke-width="0.3" />

  <!-- Scalp closure suture line above the puck (subtle) -->
  <path d="M 30 95 L 50 95 M 60 95 L 80 95 M 90 95 L 110 95 M 120 95 L 140 95 M 150 95 L 170 95 M 180 95 L 200 95 M 210 95 L 230 95 M 240 95 L 260 95 M 270 95 L 290 95 M 300 95 L 320 95"
        stroke="#a06860" stroke-width="0.6" opacity="0.55" />

  <!-- Threads exiting the intact-side bottom — faint, just to show context -->
  <line x1="105" y1="168" x2="100" y2="220" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />
  <line x1="135" y1="168" x2="132" y2="240" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />
  <line x1="165" y1="168" x2="166" y2="260" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />
  <line x1="195" y1="168" x2="195" y2="240" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />
  <line x1="225" y1="168" x2="228" y2="220" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />
  <line x1="255" y1="168" x2="260" y2="230" stroke="#d4af37" stroke-width="0.4" opacity="0.55" />

  <!-- ============================================================ -->
  <!-- JAGGED CUT EDGE — vertical between left half and right half    -->
  <!-- ============================================================ -->

  <path d="M 300 106 L 304 114 L 300 122 L 304 130 L 300 138 L 304 146 L 300 154 L 304 162 L 300 168"
        fill="#555" stroke="#333" stroke-width="0.6" />
  <path d="M 300 168 L 300 106" stroke="#3a3a3f" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- RIGHT HALF — CUTAWAY (housing sliced open, internals visible) -->
  <!-- ============================================================ -->

  <!-- Top hermetic lid right half (thin shell of titanium) -->
  <rect x="304" y="106" width="240" height="4" fill="#dde0e3" stroke="#666" stroke-width="0.4" />
  <rect x="304" y="110" width="240" height="3" fill="#9aa0a6" stroke="#666" stroke-width="0.4" />
  <text x="424" y="103" font-family="ui-sans-serif, system-ui" font-size="6" fill="#555" text-anchor="middle">hermetic lid (Ti)</text>

  <!-- Reference marker on lid (right half) -->
  <circle cx="320" cy="108" r="1.8" fill="#1a1a1f" />
  <circle cx="380" cy="108" r="1.8" fill="#1a1a1f" />
  <circle cx="440" cy="108" r="1.8" fill="#1a1a1f" />
  <circle cx="500" cy="108" r="1.8" fill="#1a1a1f" />

  <!-- Inductive charging coil — copper toroid loops under the lid -->
  <rect x="308" y="113" width="232" height="9" fill="url(#coilRing)" stroke="#7a4a20" stroke-width="0.4" />
  <!-- Coil winding hatch -->
  <line x1="312" y1="113" x2="312" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="320" y1="113" x2="320" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="328" y1="113" x2="328" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="336" y1="113" x2="336" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="344" y1="113" x2="344" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="352" y1="113" x2="352" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="360" y1="113" x2="360" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="368" y1="113" x2="368" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="510" y1="113" x2="510" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="518" y1="113" x2="518" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="526" y1="113" x2="526" y2="122" stroke="#7a4a20" stroke-width="0.4" />
  <line x1="534" y1="113" x2="534" y2="122" stroke="#7a4a20" stroke-width="0.4" />

  <!-- Bluetooth antenna trace — thin curved silver around inside perimeter -->
  <path d="M 310 124 Q 424 130 540 124" stroke="#c0c0c8" stroke-width="1.2" fill="none" />
  <text x="540" y="129" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#555" text-anchor="end">BLE antenna (2.4 GHz)</text>

  <!-- ASIC die — large rectangle (CMOS chip with 1024 amp channels) -->
  <rect x="320" y="128" width="180" height="18" fill="#1f2227" stroke="#000" stroke-width="0.6" rx="1" />
  <!-- PCB substrate under chip -->
  <rect x="316" y="146" width="188" height="3" fill="#1a5a3a" stroke="#0e3a24" stroke-width="0.3" />
  <!-- Wire bonds from ASIC to feedthrough -->
  <line x1="324" y1="146" x2="316" y2="155" stroke="#d4af37" stroke-width="0.4" />
  <line x1="340" y1="146" x2="336" y2="155" stroke="#d4af37" stroke-width="0.4" />
  <line x1="460" y1="146" x2="464" y2="155" stroke="#d4af37" stroke-width="0.4" />
  <line x1="488" y1="146" x2="500" y2="155" stroke="#d4af37" stroke-width="0.4" />
  <!-- ASIC label -->
  <text x="410" y="139" font-family="ui-monospace, monospace" font-size="6.5" fill="#dde0e3" text-anchor="middle">N1 ASIC · 1024ch</text>

  <!-- Lithium cell — small cylinder shown in side view, to the right of ASIC -->
  <rect x="504" y="128" width="32" height="20" fill="#4a4e54" stroke="#1a1a1f" stroke-width="0.5" rx="1.2" />
  <rect x="504" y="128" width="32" height="3" fill="#6a6e74" stroke="#1a1a1f" stroke-width="0.3" />
  <text x="520" y="142" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#dde0e3" text-anchor="middle">Li cell</text>

  <!-- Hermetic feedthrough ring (glass-to-metal seal at base) -->
  <rect x="304" y="155" width="240" height="6" fill="#6a6e74" stroke="#3a3a3f" stroke-width="0.4" />
  <!-- Feedthrough pin pattern -->
  <line x1="310" y1="155" x2="310" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="318" y1="155" x2="318" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="326" y1="155" x2="326" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="334" y1="155" x2="334" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="342" y1="155" x2="342" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="350" y1="155" x2="350" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="362" y1="155" x2="362" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="378" y1="155" x2="378" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="394" y1="155" x2="394" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="412" y1="155" x2="412" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="432" y1="155" x2="432" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="450" y1="155" x2="450" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="468" y1="155" x2="468" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="486" y1="155" x2="486" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="504" y1="155" x2="504" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="522" y1="155" x2="522" y2="161" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="538" y1="155" x2="538" y2="161" stroke="#dde0e3" stroke-width="0.4" />

  <!-- Polymer thread relief block under feedthrough -->
  <rect x="320" y="161" width="208" height="6" fill="#2a2d33" stroke="#1a1a1f" stroke-width="0.4" />
  <text x="424" y="172" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#444" text-anchor="middle">polymer thread relief block</text>

  <!-- ============================================================ -->
  <!-- THREAD TASSEL — 64 polymer threads exiting the puck into cortex -->
  <!-- ============================================================ -->

  <!-- Threads draw slightly fanned out, going through dura into cortex.
       Vary length and curvature so they look like a real tassel. -->
  <g stroke="#d4af37" stroke-width="0.5" fill="none">
    <path d="M 320 167 Q 318 220 314 290" />
    <path d="M 326 167 Q 326 230 326 300" />
    <path d="M 332 167 Q 334 230 340 310" />
    <path d="M 338 167 Q 342 240 350 320" />
    <path d="M 344 167 Q 348 230 356 305" />
    <path d="M 350 167 Q 352 230 358 295" />
    <path d="M 356 167 Q 358 230 362 290" />
    <path d="M 362 167 Q 362 240 364 318" />
    <path d="M 368 167 Q 370 230 374 295" />
    <path d="M 374 167 Q 376 235 380 310" />
    <path d="M 380 167 Q 382 230 386 290" />
    <path d="M 386 167 Q 388 235 394 320" />
    <path d="M 392 167 Q 394 240 396 312" />
    <path d="M 398 167 Q 400 230 402 295" />
    <path d="M 404 167 Q 404 240 408 320" />
    <path d="M 410 167 Q 410 230 412 290" />
    <path d="M 416 167 Q 418 235 422 305" />
    <path d="M 422 167 Q 424 240 428 320" />
    <path d="M 428 167 Q 430 230 434 290" />
    <path d="M 434 167 Q 436 240 440 318" />
    <path d="M 440 167 Q 442 235 446 305" />
    <path d="M 446 167 Q 448 240 452 320" />
    <path d="M 452 167 Q 454 230 458 295" />
    <path d="M 458 167 Q 460 240 464 312" />
    <path d="M 464 167 Q 466 230 468 290" />
    <path d="M 470 167 Q 472 240 476 318" />
    <path d="M 476 167 Q 478 235 482 305" />
    <path d="M 482 167 Q 484 230 488 290" />
    <path d="M 488 167 Q 490 240 494 320" />
    <path d="M 494 167 Q 496 235 502 305" />
    <path d="M 500 167 Q 502 240 506 290" />
    <path d="M 506 167 Q 510 230 514 295" />
    <path d="M 512 167 Q 516 240 522 318" />
    <path d="M 518 167 Q 522 235 528 300" />
  </g>

  <!-- Electrode tip cluster — small iridium-oxide dots at thread ends in layer V -->
  <g fill="#7af7c4" stroke="#1aa07a" stroke-width="0.3">
    <circle cx="314" cy="290" r="1.4" />
    <circle cx="326" cy="300" r="1.4" />
    <circle cx="340" cy="310" r="1.4" />
    <circle cx="350" cy="320" r="1.4" />
    <circle cx="356" cy="305" r="1.4" />
    <circle cx="358" cy="295" r="1.4" />
    <circle cx="362" cy="290" r="1.4" />
    <circle cx="364" cy="318" r="1.4" />
    <circle cx="374" cy="295" r="1.4" />
    <circle cx="380" cy="310" r="1.4" />
    <circle cx="386" cy="290" r="1.4" />
    <circle cx="394" cy="320" r="1.4" />
    <circle cx="396" cy="312" r="1.4" />
    <circle cx="402" cy="295" r="1.4" />
    <circle cx="408" cy="320" r="1.4" />
    <circle cx="412" cy="290" r="1.4" />
    <circle cx="422" cy="305" r="1.4" />
    <circle cx="428" cy="320" r="1.4" />
    <circle cx="434" cy="290" r="1.4" />
    <circle cx="440" cy="318" r="1.4" />
    <circle cx="446" cy="305" r="1.4" />
    <circle cx="452" cy="320" r="1.4" />
    <circle cx="458" cy="295" r="1.4" />
    <circle cx="464" cy="312" r="1.4" />
    <circle cx="468" cy="290" r="1.4" />
    <circle cx="476" cy="318" r="1.4" />
    <circle cx="482" cy="305" r="1.4" />
    <circle cx="488" cy="290" r="1.4" />
    <circle cx="494" cy="320" r="1.4" />
    <circle cx="502" cy="305" r="1.4" />
    <circle cx="506" cy="290" r="1.4" />
    <circle cx="514" cy="295" r="1.4" />
    <circle cx="522" cy="318" r="1.4" />
    <circle cx="528" cy="300" r="1.4" />
  </g>

  <!-- ============================================================ -->
  <!-- THIN ANNOTATIONS                                              -->
  <!-- ============================================================ -->

  <text x="180" y="80" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">EXTERIOR</text>
  <text x="424" y="80" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">CUTAWAY</text>

  <!-- Tissue labels on far right -->
  <text x="585" y="142" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" text-anchor="end">skull</text>
  <text x="585" y="161" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" text-anchor="end">dura mater</text>
  <text x="585" y="180" font-family="ui-sans-serif, system-ui" font-size="6" fill="#664" text-anchor="end">cortex</text>

  <!-- Scale bar -->
  <line x1="20" y1="475" x2="63" y2="475" stroke="#555" stroke-width="1" />
  <text x="42" y="487" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~5 mm</text>

  <!-- Dimensions caption -->
  <text x="580" y="487" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">23 mm dia × 8 mm thick · 64 threads × 16 electrodes</text>
</svg>
