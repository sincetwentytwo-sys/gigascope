<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Model Y (Juniper) — top-down cutaway / interior layout.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: bird's-eye view with the panoramic glass roof removed. Front
  of car at LEFT, rear at RIGHT. Adds front + rear megacastings (light
  steel boxes wrapping the drive units), 4680 structural pack, heat-pump
  near the frunk. Layout shares the Model 3 platform but the body is
  wider/taller and the rear cargo zone is bigger (no trunk lid — power
  liftgate opens to the cabin).

  viewBox 800x400 holds the 4790mm L x 1920mm W SUV plan.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ybody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8cdd3" />
      <stop offset="100%" stop-color="#a0a6ad" />
    </linearGradient>
    <linearGradient id="yglass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a7c4e0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6d8aa8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="ypack" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3a5e80" />
      <stop offset="50%" stop-color="#4a90c2" />
      <stop offset="100%" stop-color="#3a5e80" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- BODY OUTLINE — SUV crossover plan, wider than Model 3        -->
  <!-- ============================================================ -->
  <path d="M 60 200
           C 70 110, 130 75, 200 70
           L 610 70
           C 680 70, 735 100, 745 145
           L 748 200
           L 745 255
           C 735 300, 680 330, 610 330
           L 200 330
           C 130 325, 70 290, 60 200 Z"
        fill="url(#ybody)" stroke="#444" stroke-width="1.2" />

  <!-- Hood / frunk area -->
  <line x1="180" y1="82" x2="180" y2="318" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2" />
  <text x="120" y="200" font-family="ui-sans-serif, system-ui" font-size="9" fill="#666" text-anchor="middle">FRUNK</text>

  <!-- Windshield arc -->
  <path d="M 220 95 Q 245 200 220 305" stroke="url(#yglass)" stroke-width="14" fill="none" opacity="0.75" />

  <!-- Continuous panoramic glass roof (windshield to tailgate, no B-pillar break) -->
  <rect x="245" y="100" width="305" height="200" fill="url(#yglass)" opacity="0.40" stroke="#7a98b8" stroke-width="0.6" stroke-dasharray="2 2" />

  <!-- Liftgate line -->
  <line x1="608" y1="82" x2="608" y2="318" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2" />
  <text x="685" y="200" font-family="ui-sans-serif, system-ui" font-size="9" fill="#666" text-anchor="middle">CARGO / HATCH</text>

  <!-- Front lightbar across nose (Juniper full-width) -->
  <rect x="73" y="155" width="8" height="90" fill="#e8eef8" stroke="#88aaff" stroke-width="0.6" rx="2" />

  <!-- Rear lightbar (indirect/reflected red) -->
  <rect x="722" y="155" width="6" height="90" fill="#ff5555" opacity="0.65" stroke="#a01010" stroke-width="0.5" rx="2" />

  <!-- ============================================================ -->
  <!-- WHEELS (4) — slightly larger than Model 3 (19" Crossflow)    -->
  <!-- ============================================================ -->
  <ellipse cx="200" cy="68" rx="36" ry="16" fill="#16181c" stroke="#000" stroke-width="0.8" />
  <ellipse cx="200" cy="332" rx="36" ry="16" fill="#16181c" stroke="#000" stroke-width="0.8" />
  <ellipse cx="600" cy="68" rx="36" ry="16" fill="#16181c" stroke="#000" stroke-width="0.8" />
  <ellipse cx="600" cy="332" rx="36" ry="16" fill="#16181c" stroke="#000" stroke-width="0.8" />
  <ellipse cx="200" cy="68" rx="22" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="200" cy="332" rx="22" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="600" cy="68" rx="22" ry="10" fill="none" stroke="#888" stroke-width="0.6" />
  <ellipse cx="600" cy="332" rx="22" ry="10" fill="none" stroke="#888" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- MEGACASTINGS — light gray boxes wrapping front/rear DUs       -->
  <!-- ============================================================ -->
  <rect x="145" y="115" width="80" height="170" fill="#9aa2ad" stroke="#555" stroke-width="0.8" opacity="0.55" rx="3" />
  <text x="185" y="108" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle">FRONT MEGACAST</text>

  <rect x="575" y="115" width="80" height="170" fill="#9aa2ad" stroke="#555" stroke-width="0.8" opacity="0.55" rx="3" />
  <text x="615" y="108" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444" text-anchor="middle">REAR MEGACAST</text>

  <!-- ============================================================ -->
  <!-- DRIVE UNITS                                                   -->
  <!-- ============================================================ -->
  <rect x="160" y="170" width="55" height="60" fill="#6a7280" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="187" y="202" font-family="ui-sans-serif, system-ui" font-size="7" fill="#fff" text-anchor="middle">FRONT</text>
  <text x="187" y="212" font-family="ui-sans-serif, system-ui" font-size="7" fill="#fff" text-anchor="middle">INDUCT.</text>

  <rect x="590" y="170" width="55" height="60" fill="#8a939e" stroke="#222" stroke-width="0.8" rx="3" />
  <text x="617" y="202" font-family="ui-sans-serif, system-ui" font-size="7" fill="#fff" text-anchor="middle">REAR</text>
  <text x="617" y="212" font-family="ui-sans-serif, system-ui" font-size="7" fill="#fff" text-anchor="middle">PMSM</text>

  <!-- ============================================================ -->
  <!-- 4680 STRUCTURAL BATTERY PACK                                  -->
  <!-- ============================================================ -->
  <rect x="225" y="115" width="345" height="170" fill="url(#ypack)" stroke="#1a3050" stroke-width="1" opacity="0.55" rx="4" />
  <!-- 4680 cell-grid pattern (larger cells than 2170) -->
  <g stroke="#1a3050" stroke-width="0.4" opacity="0.4">
    <line x1="225" y1="145" x2="570" y2="145" />
    <line x1="225" y1="175" x2="570" y2="175" />
    <line x1="225" y1="205" x2="570" y2="205" />
    <line x1="225" y1="235" x2="570" y2="235" />
    <line x1="225" y1="265" x2="570" y2="265" />
    <line x1="265" y1="115" x2="265" y2="285" />
    <line x1="305" y1="115" x2="305" y2="285" />
    <line x1="345" y1="115" x2="345" y2="285" />
    <line x1="385" y1="115" x2="385" y2="285" />
    <line x1="425" y1="115" x2="425" y2="285" />
    <line x1="465" y1="115" x2="465" y2="285" />
    <line x1="505" y1="115" x2="505" y2="285" />
    <line x1="545" y1="115" x2="545" y2="285" />
  </g>
  <text x="397" y="204" font-family="ui-sans-serif, system-ui" font-size="9" fill="#0a2240" text-anchor="middle" font-weight="600">4680 STRUCTURAL · 78 kWh</text>

  <!-- ============================================================ -->
  <!-- CABIN: 5-seat layout (driver/pass + 3-up rear bench)          -->
  <!-- ============================================================ -->
  <!-- Front row -->
  <rect x="280" y="120" width="42" height="55" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="280" y="225" width="42" height="55" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="301" y="152" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">DRIVER</text>
  <text x="301" y="257" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">PASS</text>

  <!-- 15" center touchscreen -->
  <rect x="332" y="188" width="32" height="24" fill="#0a0a0e" stroke="#444" stroke-width="0.5" rx="2" />
  <rect x="335" y="191" width="26" height="18" fill="#1a1f2e" />

  <!-- Rear bench (3-up) -->
  <rect x="430" y="115" width="135" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <rect x="430" y="205" width="135" height="80" fill="#1f1f24" stroke="#444" stroke-width="0.5" rx="6" />
  <text x="497" y="158" font-family="ui-sans-serif, system-ui" font-size="6" fill="#aaa" text-anchor="middle">REAR BENCH</text>

  <!-- 8" rear-passenger screen (back of center console) -->
  <rect x="402" y="194" width="20" height="12" fill="#0a0a0e" stroke="#444" stroke-width="0.4" rx="1" />
  <rect x="404" y="196" width="16" height="8" fill="#1a1f2e" />
  <text x="412" y="217" font-family="ui-sans-serif, system-ui" font-size="5" fill="#666" text-anchor="middle">8" REAR</text>

  <!-- ============================================================ -->
  <!-- CAMERAS / SENSORS                                             -->
  <!-- ============================================================ -->
  <!-- Front trifocal (windshield top) -->
  <circle cx="232" cy="190" r="3.5" fill="#0a0a0c" stroke="#666" stroke-width="0.4" />
  <circle cx="232" cy="200" r="3.5" fill="#0a0a0c" stroke="#666" stroke-width="0.4" />
  <circle cx="232" cy="210" r="3.5" fill="#0a0a0c" stroke="#666" stroke-width="0.4" />
  <text x="245" y="203" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">trifocal</text>

  <!-- B-pillar cameras (left + right) -->
  <circle cx="380" cy="100" r="3.5" fill="#0a0a0c" stroke="#666" stroke-width="0.4" />
  <circle cx="380" cy="300" r="3.5" fill="#0a0a0c" stroke="#666" stroke-width="0.4" />
  <text x="385" y="96" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">B-pillar L</text>
  <text x="385" y="313" font-family="ui-sans-serif, system-ui" font-size="6" fill="#444">B-pillar R</text>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                   -->
  <!-- ============================================================ -->
  <text x="120" y="55" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444">FRONT</text>
  <text x="680" y="55" font-family="ui-sans-serif, system-ui" font-size="9" font-style="italic" fill="#444">REAR</text>
  <text x="400" y="55" font-family="ui-sans-serif, system-ui" font-size="10" font-style="italic" fill="#444" text-anchor="middle">TOP-DOWN · INTERIOR LAYOUT</text>

  <path d="M 60 55 L 90 55 L 85 50 M 90 55 L 85 60" stroke="#444" stroke-width="0.8" fill="none" />

  <line x1="60" y1="380" x2="160" y2="380" stroke="#555" stroke-width="1" />
  <text x="110" y="392" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~1 m (to scale)</text>

  <text x="740" y="392" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">4790 mm L × 1920 mm W</text>
</svg>
