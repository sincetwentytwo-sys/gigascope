<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tesla Optimus Gen 3 — schematic cutaway / front cross-section.
  Original work for gigascope.xyz. CC0 / public domain.

  Convention: left half shows the intact smooth gray/white humanoid
  silhouette (head, chest, arms, legs); right half is sliced open on a
  jagged vertical cut down the spine to expose the camera cluster behind
  the face plate, the FSD-derivative compute board and 2.3 kWh chest
  battery, the central wiring spine, the planetary shoulder/elbow/wrist
  actuators, the forearm tendon drum housing the hand actuators, the
  3-DOF hip actuator stack with IMU, the high-torque knee actuator, and
  the ankle drive at the foot. Coolant loop runs blue from the chest
  reservoir down each thigh to the knee branch.

  Vertical aspect 400x700 mirrors the real 1.73 m tall humanoid front
  view. cutawayHotspot {x,y} in optimus.ts targets this image in 0..1
  normalized coords.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="opChassis" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#cacacd" />
      <stop offset="50%" stop-color="#e8e8ec" />
      <stop offset="100%" stop-color="#cacacd" />
    </linearGradient>
    <linearGradient id="opHead" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="50%" stop-color="#2a2a30" />
      <stop offset="100%" stop-color="#0a0a10" />
    </linearGradient>
    <linearGradient id="actuator" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b0b0b6" />
      <stop offset="100%" stop-color="#7a7a80" />
    </linearGradient>
    <pattern id="batteryCellsOp" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" fill="#2a2d33" />
      <circle cx="1.5" cy="1.5" r="1.1" fill="#5a5d63" />
      <circle cx="4.5" cy="1.5" r="1.1" fill="#5a5d63" />
      <circle cx="1.5" cy="4.5" r="1.1" fill="#5a5d63" />
      <circle cx="4.5" cy="4.5" r="1.1" fill="#5a5d63" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="700" fill="#f5f5f7" />

  <!-- ============================================================ -->
  <!-- LEFT HALF — INTACT FRONT VIEW                                -->
  <!-- ============================================================ -->

  <!-- Head dome (glossy dark face plate) -->
  <ellipse cx="115" cy="62" rx="32" ry="38" fill="url(#opHead)" stroke="#222" stroke-width="0.6" />
  <!-- Camera strip across face -->
  <rect x="92" y="56" width="46" height="14" fill="#050508" stroke="#000" stroke-width="0.3" />
  <line x1="96" y1="63" x2="134" y2="63" stroke="#1a4060" stroke-width="0.4" opacity="0.7" />

  <!-- Neck (short cylinder under chin) -->
  <rect x="106" y="98" width="18" height="14" fill="url(#actuator)" stroke="#666" stroke-width="0.4" />

  <!-- Torso shell (intact white chest) -->
  <path d="M 75 112 L 75 280 Q 75 295 90 298 L 140 298 Q 155 295 155 280 L 155 112 Z"
        fill="url(#opChassis)" stroke="#888" stroke-width="0.6" />
  <!-- Black abdomen mid-strip -->
  <rect x="75" y="260" width="80" height="38" fill="#28282d" stroke="#111" stroke-width="0.4" />
  <!-- TESLA wordmark on chest -->
  <text x="115" y="180" font-family="ui-sans-serif, system-ui" font-size="9" font-weight="600" fill="#5a5a5e" text-anchor="middle" letter-spacing="2">TESLA</text>

  <!-- Shoulders (spheres) -->
  <circle cx="170" cy="125" r="14" fill="url(#opChassis)" stroke="#888" stroke-width="0.6" />
  <circle cx="60" cy="125" r="14" fill="url(#opChassis)" stroke="#888" stroke-width="0.6" />

  <!-- Upper arms -->
  <path d="M 165 137 L 178 220 L 162 222 L 152 138 Z" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />
  <path d="M 65 137 L 52 220 L 68 222 L 78 138 Z" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />
  <!-- Black elbow pad -->
  <ellipse cx="171" cy="222" rx="11" ry="14" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />
  <ellipse cx="59" cy="222" rx="11" ry="14" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />

  <!-- Forearms -->
  <path d="M 162 234 L 178 318 L 158 322 L 148 236 Z" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />
  <path d="M 68 234 L 52 318 L 72 322 L 82 236 Z" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />

  <!-- Hands (black, articulated) -->
  <rect x="160" y="324" width="18" height="34" rx="4" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />
  <rect x="52" y="324" width="18" height="34" rx="4" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />
  <!-- Finger hints -->
  <line x1="163" y1="358" x2="163" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="167" y1="358" x2="167" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="171" y1="358" x2="171" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="175" y1="358" x2="175" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="55" y1="358" x2="55" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="59" y1="358" x2="59" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="63" y1="358" x2="63" y2="368" stroke="#0a0a0e" stroke-width="2" />
  <line x1="67" y1="358" x2="67" y2="368" stroke="#0a0a0e" stroke-width="2" />

  <!-- Pelvis (gray block under abdomen) -->
  <rect x="80" y="300" width="70" height="36" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />

  <!-- Hip joints (spheres) -->
  <circle cx="98" cy="345" r="11" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="132" cy="345" r="11" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />

  <!-- Thighs -->
  <rect x="90" y="356" width="20" height="80" rx="6" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />
  <rect x="120" y="356" width="20" height="80" rx="6" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />

  <!-- Knees (spheres) -->
  <circle cx="100" cy="445" r="11" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="130" cy="445" r="11" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />

  <!-- Shins -->
  <rect x="93" y="456" width="14" height="100" rx="4" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />
  <rect x="123" y="456" width="14" height="100" rx="4" fill="url(#opChassis)" stroke="#888" stroke-width="0.5" />

  <!-- Ankles -->
  <circle cx="100" cy="566" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="130" cy="566" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />

  <!-- Feet -->
  <rect x="86" y="572" width="28" height="14" rx="3" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />
  <rect x="116" y="572" width="28" height="14" rx="3" fill="#1a1a1f" stroke="#000" stroke-width="0.4" />

  <!-- ============================================================ -->
  <!-- JAGGED CUT LINE (vertical down spine center)                  -->
  <!-- ============================================================ -->
  <path d="M 195 35 L 200 50 L 195 65 L 200 80 L 195 95 L 200 110 L 195 125 L 200 140 L 195 155 L 200 170 L 195 185 L 200 200 L 195 215 L 200 230 L 195 245 L 200 260 L 195 275 L 200 290 L 195 305 L 200 320 L 195 335 L 200 350 L 195 365 L 200 380 L 195 395 L 200 410 L 195 425 L 200 440 L 195 455 L 200 470 L 195 485 L 200 500 L 195 515 L 200 530 L 195 545 L 200 560 L 195 575 L 200 590 L 195 590"
        fill="#555" stroke="#222" stroke-width="0.6" />

  <!-- ============================================================ -->
  <!-- RIGHT HALF — CUTAWAY (interior anatomy)                       -->
  <!-- ============================================================ -->

  <!-- HEAD INTERIOR: camera cluster + speakers behind face plate -->
  <ellipse cx="285" cy="62" rx="32" ry="38" fill="#1a1a1f" stroke="#444" stroke-width="0.5" />
  <!-- Outer dome thin shell -->
  <path d="M 200 62 A 32 38 0 0 1 317 62" fill="none" stroke="#0a0a10" stroke-width="3" />
  <!-- Camera cluster -->
  <circle cx="278" cy="55" r="4" fill="#3a9ad9" stroke="#0a0a10" stroke-width="0.4" />
  <circle cx="290" cy="55" r="4" fill="#3a9ad9" stroke="#0a0a10" stroke-width="0.4" />
  <circle cx="284" cy="68" r="3" fill="#3a9ad9" stroke="#0a0a10" stroke-width="0.4" />
  <!-- Speaker / mic vents -->
  <rect x="296" y="78" width="14" height="3" fill="#3a3a40" />
  <rect x="296" y="83" width="14" height="3" fill="#3a3a40" />
  <text x="285" y="100" font-family="ui-sans-serif, system-ui" font-size="5.5" fill="#dde0e3" text-anchor="middle">CAMERAS</text>

  <!-- NECK ACTUATOR (cut, showing internal mechanism) -->
  <rect x="276" y="102" width="18" height="14" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="285" cy="109" r="4" fill="#3a3a40" stroke="#111" stroke-width="0.4" />
  <line x1="281" y1="109" x2="289" y2="109" stroke="#888" stroke-width="0.6" />

  <!-- TORSO INTERIOR — open chest cavity outline -->
  <path d="M 245 116 L 245 280 Q 245 295 260 298 L 320 298 Q 335 295 335 280 L 335 116 Z"
        fill="#f5f5f7" stroke="#444" stroke-width="0.6" />

  <!-- Chest battery pack (2.3 kWh) -->
  <rect x="252" y="122" width="76" height="42" fill="url(#batteryCellsOp)" stroke="#1a1a1f" stroke-width="0.5" />
  <rect x="252" y="122" width="76" height="6" fill="#1c1f24" />
  <text x="290" y="148" font-family="ui-sans-serif, system-ui" font-size="6" font-weight="600" fill="#dde0e3" text-anchor="middle">2.3 kWh Li-ion</text>

  <!-- FSD-derivative compute board -->
  <rect x="252" y="170" width="76" height="42" fill="#1a3a1a" stroke="#0a2a0a" stroke-width="0.5" />
  <!-- SoC die -->
  <rect x="278" y="184" width="22" height="18" fill="#28282d" stroke="#000" stroke-width="0.4" />
  <text x="289" y="195" font-family="ui-sans-serif, system-ui" font-size="5" fill="#dde0e3" text-anchor="middle">FSD SoC</text>
  <!-- traces -->
  <line x1="256" y1="178" x2="324" y2="178" stroke="#c97f3a" stroke-width="0.4" />
  <line x1="256" y1="208" x2="324" y2="208" stroke="#c97f3a" stroke-width="0.4" />

  <!-- Liquid cooling loop reservoir + lines -->
  <rect x="252" y="218" width="40" height="18" fill="#4a90c2" stroke="#2a5e88" stroke-width="0.4" />
  <text x="272" y="230" font-family="ui-sans-serif, system-ui" font-size="5" fill="#dde0e3" text-anchor="middle">COOLANT</text>
  <!-- Coolant down-line into legs -->
  <line x1="262" y1="236" x2="262" y2="340" stroke="#4a90c2" stroke-width="2" />
  <line x1="282" y1="236" x2="282" y2="340" stroke="#4a90c2" stroke-width="2" />

  <!-- Central wiring spine (yellow ribbon) -->
  <rect x="297" y="218" width="6" height="240" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.3" />
  <text x="300" y="370" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle" transform="rotate(-90 300 370)">SERIAL BUS</text>

  <!-- Rear cooling vents (visible from inside as exit slots) -->
  <rect x="252" y="244" width="40" height="14" fill="none" stroke="#666" stroke-width="0.4" />
  <line x1="254" y1="248" x2="290" y2="248" stroke="#666" stroke-width="0.4" />
  <line x1="254" y1="252" x2="290" y2="252" stroke="#666" stroke-width="0.4" />
  <line x1="254" y1="256" x2="290" y2="256" stroke="#666" stroke-width="0.4" />

  <!-- SHOULDER ACTUATOR (3-DOF, exposed) -->
  <circle cx="345" cy="125" r="14" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="345" cy="125" r="10" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="345" cy="125" r="6" fill="#3a3a40" stroke="#000" stroke-width="0.3" />
  <text x="345" y="148" font-family="ui-sans-serif, system-ui" font-size="5" fill="#444" text-anchor="middle">3-DOF</text>

  <!-- UPPER ARM (carbon-wrap tube cut, hollow) -->
  <path d="M 340 137 L 354 222 L 340 224 L 326 138 Z" fill="#3a3a40" stroke="#111" stroke-width="0.5" />
  <line x1="335" y1="160" x2="346" y2="160" stroke="#666" stroke-width="0.4" />
  <line x1="335" y1="190" x2="346" y2="190" stroke="#666" stroke-width="0.4" />

  <!-- ELBOW JOINT -->
  <circle cx="346" cy="225" r="10" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="346" cy="225" r="6" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />

  <!-- FOREARM (with hand-tendon actuator drum visible) -->
  <path d="M 340 237 L 356 318 L 336 322 L 326 239 Z" fill="#3a3a40" stroke="#111" stroke-width="0.5" />
  <!-- Tendon drum -->
  <circle cx="344" cy="270" r="8" fill="#c97f3a" stroke="#7a4a20" stroke-width="0.4" />
  <circle cx="344" cy="270" r="3" fill="#1a1a1f" />
  <line x1="344" y1="278" x2="346" y2="320" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="346" y1="278" x2="350" y2="320" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="342" y1="278" x2="340" y2="320" stroke="#dde0e3" stroke-width="0.4" />
  <text x="344" y="298" font-family="ui-sans-serif, system-ui" font-size="4.5" fill="#dde0e3" text-anchor="middle">TENDON</text>

  <!-- HAND (cut to show finger linkages) -->
  <rect x="338" y="324" width="18" height="34" rx="4" fill="#28282d" stroke="#000" stroke-width="0.4" />
  <line x1="341" y1="328" x2="341" y2="358" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="345" y1="328" x2="345" y2="358" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="349" y1="328" x2="349" y2="358" stroke="#dde0e3" stroke-width="0.4" />
  <line x1="353" y1="328" x2="353" y2="358" stroke="#dde0e3" stroke-width="0.4" />

  <!-- PELVIS INTERIOR (3-DOF hip + IMU) -->
  <rect x="245" y="300" width="90" height="36" fill="#f5f5f7" stroke="#444" stroke-width="0.5" />
  <!-- IMU (small chip in center) -->
  <rect x="282" y="312" width="16" height="12" fill="#1a3a1a" stroke="#0a2a0a" stroke-width="0.4" />
  <text x="290" y="320" font-family="ui-sans-serif, system-ui" font-size="4.5" fill="#dde0e3" text-anchor="middle">IMU</text>

  <!-- HIP ACTUATOR STACK (3-DOF, exploded view) -->
  <circle cx="268" cy="345" r="12" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="268" cy="345" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="268" cy="345" r="4" fill="#3a3a40" stroke="#000" stroke-width="0.3" />
  <circle cx="312" cy="345" r="12" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="312" cy="345" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="312" cy="345" r="4" fill="#3a3a40" stroke="#000" stroke-width="0.3" />

  <!-- THIGH INTERIOR (cooling channel visible inside the tube) -->
  <rect x="258" y="356" width="22" height="80" rx="6" fill="#3a3a40" stroke="#111" stroke-width="0.5" />
  <line x1="269" y1="356" x2="269" y2="436" stroke="#4a90c2" stroke-width="2" />
  <rect x="302" y="356" width="22" height="80" rx="6" fill="#3a3a40" stroke="#111" stroke-width="0.5" />
  <line x1="313" y1="356" x2="313" y2="436" stroke="#4a90c2" stroke-width="2" />

  <!-- KNEES (high-torque planetary) -->
  <circle cx="269" cy="445" r="12" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="269" cy="445" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="269" cy="445" r="3" fill="#1a1a1f" />
  <circle cx="313" cy="445" r="12" fill="#2a2a30" stroke="#000" stroke-width="0.5" />
  <circle cx="313" cy="445" r="8" fill="url(#actuator)" stroke="#555" stroke-width="0.4" />
  <circle cx="313" cy="445" r="3" fill="#1a1a1f" />

  <!-- SHIN INTERIOR (ankle actuator at lower end) -->
  <rect x="262" y="457" width="14" height="100" rx="4" fill="#3a3a40" stroke="#111" stroke-width="0.5" />
  <rect x="306" y="457" width="14" height="100" rx="4" fill="#3a3a40" stroke="#111" stroke-width="0.5" />

  <!-- Ankle actuator at base of shin -->
  <circle cx="269" cy="566" r="8" fill="#2a2a30" stroke="#000" stroke-width="0.4" />
  <circle cx="269" cy="566" r="5" fill="url(#actuator)" stroke="#555" stroke-width="0.3" />
  <circle cx="313" cy="566" r="8" fill="#2a2a30" stroke="#000" stroke-width="0.4" />
  <circle cx="313" cy="566" r="5" fill="url(#actuator)" stroke="#555" stroke-width="0.3" />

  <!-- FEET INTERIOR (load cells) -->
  <rect x="255" y="572" width="28" height="14" rx="3" fill="#28282d" stroke="#000" stroke-width="0.4" />
  <rect x="299" y="572" width="28" height="14" rx="3" fill="#28282d" stroke="#000" stroke-width="0.4" />
  <!-- 4 load cells per foot -->
  <circle cx="261" cy="579" r="1.6" fill="#c97f3a" />
  <circle cx="270" cy="579" r="1.6" fill="#c97f3a" />
  <circle cx="277" cy="579" r="1.6" fill="#c97f3a" />
  <circle cx="305" cy="579" r="1.6" fill="#c97f3a" />
  <circle cx="314" cy="579" r="1.6" fill="#c97f3a" />
  <circle cx="321" cy="579" r="1.6" fill="#c97f3a" />

  <!-- ============================================================ -->
  <!-- LABELS                                                       -->
  <!-- ============================================================ -->
  <text x="115" y="675" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">EXTERIOR</text>
  <text x="285" y="675" font-family="ui-sans-serif, system-ui" font-size="11" font-style="italic" fill="#444" text-anchor="middle">CUTAWAY</text>

  <!-- Scale bar (1 meter ~210 units in this scale) -->
  <line x1="20" y1="630" x2="60" y2="630" stroke="#555" stroke-width="1" />
  <text x="40" y="624" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="middle">~25 cm</text>

  <!-- Dimensions caption -->
  <text x="380" y="695" font-family="ui-monospace, monospace" font-size="7" fill="#555" text-anchor="end">1.73 m · 57 kg · 28 body DOFs · 22 DOFs/hand</text>
</svg>
