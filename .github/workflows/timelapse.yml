name: Weekly satellite timelapse

# Captures fresh Sentinel-2 frames for all 16 sites every Monday,
# rebuilds MP4 timelapses, and commits the videos to public/timelapses/.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      only_slug:
        description: "Capture/build a single slug only (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  capture-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture frames from Sentinel Hub
        id: capture
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ONLY_SLUG: ${{ inputs.only_slug }}
        run: node scripts/timelapse/capture.mjs

      - name: Build MP4 timelapses
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ONLY_SLUG: ${{ inputs.only_slug }}
        run: node scripts/timelapse/build.mjs

      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/timelapses/
          if git diff --cached --quiet; then
            echo "No video changes to commit"
          else
            git commit -m "timelapse: weekly rebuild $(date -u +%Y-%m-%d)"
            git push
          fi
