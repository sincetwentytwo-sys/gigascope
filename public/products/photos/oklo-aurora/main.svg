    <text x="660" y="482" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Turbine + generator</text>
    <text x="660" y="502" text-anchor="middle" font-size="11" fill="#9ca3af">Brayton or Rankine</text>
  </g>
  
  <g>
    <rect x="350" y="540" width="300" height="50" rx="6" fill="#9ca3af" fill-opacity="0.18" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="500" y="557" text-anchor="middle" font-size="14" font-weight="600" fill="#e5e7eb">Grid interconnect</text>
